# The overhead gate after a change to the agent, run locally with act: act -W .github/act/gates.yml
name: Gates
on: push
jobs:
  overhead:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B -q package -DskipTests
      - run: demo/overhead.sh
