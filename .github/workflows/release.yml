# The only workflow GitHub runs; run Qodana locally first (AGENTS.md):
# a tag such as v1.0.0 builds, tests and publishes a Release with the GUI as an app image with its own Java runtime
# for Linux, Windows and macOS (gui/app-image.sh), and SHA256SUMS. CI runs locally with act (.github/act).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  jars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            agent/target/jvmeter-agent.jar
            gui/target/jvmeter-gui.jar
            demo/target/jvmeter-demo.jar
  app-image:
    needs: jars
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: jars
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25 # the runtime the app image ships
      - run: gui/app-image.sh "${GITHUB_REF_NAME#v}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: app-image-${{ matrix.os }}
          path: target/dist/*
  release:
    needs: app-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        if: ${{ !env.ACT }} # act: build and test only
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          sha256sum *.zip *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            *.zip *.tar.gz SHA256SUMS
