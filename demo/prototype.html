    </tbody></table></div>` : `<div class="empty">${snap.memory.allocations ? "No allocation samples yet" : "This snapshot has no allocation samples: newer agents record them"}</div>`}</section>`;
  return `${head}<div class="split"><div class="gc-main" tabindex="0" aria-label="GC analysis">${kpis}${chart}<div class="gc-row2">${hist}${causes}</div>${gensHtml}${allocHtml}
    <p class="note">Source: JFR jdk.GarbageCollection / jdk.GCHeapSummary / jdk.G1HeapSummary / jdk.MetaspaceSummary. Metrics follow GCeasy's definitions (throughput = 100 − total pause ÷ recording time).</p></div>${probs}</div>`;
}

// seconds a thread spent in a state: the agent's totals (sampled every 100 ms, so blocks shorter than a second count), else the timeline's
function secIn(t, k) { return t.sec ? t.sec[k] || 0 : t.segs.filter(s => s[2] === k).reduce((a, s) => a + s[1] - s[0], 0); }
// where threads waited (snapshot waits): a row selects the thread that waited there most

  const what = w => w.state === "block" ? (w.lock ? shortLock(w.lock) : "a lock") : "I/O in " + shortName(w.top);
  const sel = waits.findIndex(w => w.threads[0] === (threads[state.thread] || {}).name);
  return `<section class="panel"><h2>Where threads waited <span class="note" style="font-weight:400">thread samples every 100 ms · ${waits.length}</span></h2>

    ${waits.map((w, i) => { const ti = threads.findIndex(t => t.name === w.threads[0]);

    </tbody></table></div>` : `<div class="empty">${snap.waits ? "No thread waited for a lock or for I/O" : "This snapshot has no waits: newer agents record where threads wait"}</div>`}</section>`;

function viewThreads() {
  const sec = state.elapsed;

  const t = threads[state.thread];
  const sum = k => t ? secIn(t, k) : 0;
  const axis = [0, .25, .5, .75, 1].map(f => `<span>${fmtClock(Math.round(sec * f))}</span>`).join("");
  return `<div class="view-head"><h1>Threads</h1>
    <div class="legend"><span><i style="background:var(--run)"></i>Running</span><span><i style="background:var(--wait)"></i>Waiting</span><span><i style="background:var(--block)"></i>Blocked (lock)</span><span><i style="background:var(--io)"></i>Network I/O</span></div></div>
  <div class="split"><div class="th-main">
    <section class="panel"><div class="tl">
      ${threads.map((th, i) => {

        <div class="tl-bar" data-thread="${i}">${th.segs.map(s => `<span style="left:${s[0] / sec * 100}%;width:${(s[1] - s[0]) / sec * 100}%;background:var(${col[s[2]]})"></span>`).join("")}</div>
        <span class="num note" style="text-align:right">${b ? `<span style="color:var(--bad)">${b}s</span>` : ""}</span></div>`;
      }).join("")}

    <aside class="panel side">${t ? `<h2><svg class="ic" aria-hidden="true"><use href="#i-view_timeline"/></svg>${esc(t.name)}</h2>
      <h3>Time by state</h3>
      <dl class="kv"><dt>Running</dt><dd class="num">${sum("run")} s</dd><dt>Waiting</dt><dd class="num">${sum("wait")} s</dd>
        <dt>Blocked</dt><dd class="num" style="${sum("block") ? "color:var(--bad)" : ""}">${sum("block")} s</dd><dt>Network I/O</dt><dd class="num">${sum("io")} s</dd></dl>
      <h3>Current stack</h3><div class="stack">${t.stack.map((f, i) => `<div>${i ? "at " : ""}${esc(f)}</div>`).join("")}</div>` : `<div class="empty">Select a thread.</div>`}
    </aside>

}

// ---------- interaction ----------
document.querySelector(".rail").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]"); if (!b) return;
  state.view = b.dataset.view; render(); main.focus();
});
document.getElementById("rec").addEventListener("click", () => {
  state.recording = !state.recording;
  if (state.recording) timer = setInterval(tick, 1000); else { clearInterval(timer); timer = null; }
  render();
});
function tick() {
  state.elapsed++;
  simTel(tel, state.elapsed, state.elapsed);
  compactTel(tel, state.elapsed);
  if (gc && gc.sim) gc.sim.step(state.elapsed - 1, gc.events);
  syncHeapTelemetry(true);
  // data growth while recording: Order objects pile up in a cache (an example leak)
  for (const c of classes) {
    const g = c.leak ? 420 : c.name === "byte[]" ? 900 : c.name === "java.lang.String" ? 700 : 40;
    c.count += Math.round(g * (0.6 + Math.random() * 0.8));
    c.bytes = Math.round(c.bytes * (1 + g / 1e6));
  }
  pushHist();
  for (const th of threads) {
    const last = th.segs.at(-1);
    if (last && last[1] === state.elapsed - 1) last[1] = state.elapsed;
    th.segs = compactSegs(th.segs, state.elapsed);
  }
  // do not re-render while the user is typing
  if (document.activeElement && document.activeElement.id === "q") { renderRec(); return; }
  render();
}
main.addEventListener("click", e => {

    try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch { done(false); }
    return;
  }

  const s = e.target.closest("[data-sort]");
  if (s) { const k = s.dataset.sort; state.sortDir = state.sortKey === k ? (state.sortDir === "asc" ? "desc" : "asc") : (k === "name" ? "asc" : "desc"); state.sortKey = k; render(); return; }
  const ts = e.target.closest("[data-tsort]");
  if (ts) { const k = ts.dataset.tsort; state.tsortDir = state.tsortKey === k ? (state.tsortDir === "asc" ? "desc" : "asc") : (k === "name" ? "asc" : "desc"); state.tsortKey = k; render(); return; }
  const ms = e.target.closest("[data-msort]"); if (ms) { state.memSort = ms.dataset.msort; render(); return; }
  if (e.target.closest("#snapBefore")) { state.picking = "before"; state.hoverT = null; render(); return; }
  if (e.target.closest("#snapAfter")) { if (state.snapBefore) { state.picking = "after"; state.hoverT = null; render(); } return; }
  if (e.target.closest("#snapClear")) { state.snapBefore = state.snapAfter = null; state.memSort = "bytes"; render(); return; }
  const tog = e.target.closest("[data-tog]");
  if (tog) { const id = +tog.dataset.tog; state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); render(); return; }
  const tn = e.target.closest("[data-node]");
  if (tn) { let n; walk(root, x => { if (x.id === +tn.dataset.node) n = x; }); if (n && n.parent) state.sel = n.name; render(); return; }
  const hr = e.target.closest("[data-hot]"); if (hr) { state.sel = hr.dataset.hot; render(); return; }
  const th = e.target.closest("[data-thread]"); if (th) { state.thread = +th.dataset.thread; render(); return; }
  if (e.target.closest("#showintree")) {

    render(); return;
  }
  if (e.target.closest("#hotpath")) { state.expanded = new Set([root.id]); const leaf = expandHotPath(root); state.sel = leaf.name; render(); return; }
  if (e.target.closest("#expandall")) { walk(root, n => state.expanded.add(n.id)); render(); return; }
  if (e.target.closest("#collapseall")) { state.expanded = new Set([root.id]); render(); return; }
  if (e.target.closest("#gc")) {
    // only unreachable objects go away; the leaked Orders stay
    for (const c of classes) if (!c.leak && c.name !== "java.lang.Class") { const k = 0.55 + Math.random() * 0.1; c.count = Math.round(c.count * k); c.bytes = Math.round(c.bytes * k); }
    // add it as a Run GC event (manual: excluded from the System.gc() rule).
    // heap usage is derived from GC events, so the chart drops at this point
    if (gc) {
      const last = gc.events.at(-1) || { t: 0, afterMB: 300, oldAfterMB: 250, metaspaceMB: 88 };

      gc.events.push({ t, name: "Full", cause: "System.gc()", manual: true, pauseMs: +(140 + Math.random() * 60).toFixed(1),

      if (gc.sim) gc.sim.sync(after, old, t);
      syncHeapTelemetry(true);
    } else {
      tel._heap = Math.max(180, tel._heap * 0.45); tel.heap[tel.heap.length - 1] = tel._heap;
    }
    state.copied = null;
    if (chist.length) chist[chist.length - 1] = takeSnap();
    render(); return;
  }
});

// fit numeric column widths to their content
const MIN_COL = 40;
function applyColw(t) {
  const el = main.querySelector(`[data-rz-table="${t}"]`);
  if (!el) return;
  if (t === "tree") colw.tree.slice(1).forEach((w, i) => el.style.setProperty(`--c${i + 1}`, w + "px"));
  else el.querySelectorAll("col").forEach((c, i) => { if (colw[t][i]) c.style.width = colw[t][i] + "px"; });
}
// width of the longest content (including the header) shown in each column. The name column (0) is truncated with an ellipsis, so it is skipped
function colMins(t) {
  const el = main.querySelector(`[data-rz-table="${t}"]`);
  const mins = colw[t].map(() => MIN_COL);
  if (!el) return mins;
  const range = document.createRange();
  const need = (cell, header) => {
    let w;
    // a header: its sort button, or its text when it has none
    if (header) { const b = cell.querySelector("button"); if (b) w = b.getBoundingClientRect().width; else { range.selectNodeContents(cell); w = range.getBoundingClientRect().width; } }
    else {
      // a meter floats at the left edge, so measure the number after it and add the meter (64px + 8px gap)
      const m = cell.querySelector(".meter");
      range.selectNodeContents(cell);
      if (m) range.setStartAfter(m);
      w = range.getBoundingClientRect().width + (m ? 72 : 0);
    }
    const cs = getComputedStyle(cell);
    return Math.ceil(w + (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0) + 6);
  };
  const rows = t === "tree"
    ? [[...el.querySelectorAll(".thead > span")], ...[...el.querySelectorAll(".trow")].map(r => [...r.children])]
    : [[...el.querySelectorAll("thead th")], ...[...el.querySelectorAll("tbody tr")].map(r => [...r.children])];
  rows.forEach((cells, ri) => cells.forEach((c, k) => { if (k > 0 && k < mins.length) mins[k] = Math.max(mins[k], need(c, ri === 0)); }));
  return mins;
}
// fit numeric columns exactly (grow with more digits, shrink with fewer). The name column takes the rest
function fitCols() {
  for (const t of Object.keys(colw)) {
    if (!main.querySelector(`[data-rz-table="${t}"]`)) continue;
    const mins = colMins(t);
    let changed = false;
    colw[t] = colw[t].map((w, k) => { if (k > 0 && w !== null && w !== mins[k]) { changed = true; return mins[k]; } return w; });
    if (changed) applyColw(t);
  }
}

// reference point picking: the time under the mouse (whole seconds). After is limited to after Before
function pickTime(plot, e) {
  const r = plot.getBoundingClientRect(), x0 = +plot.dataset.x0, x1 = +plot.dataset.x1;
  const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  let t = Math.round(x0 + f * (x1 - x0));
  if (plot.dataset.min !== "") t = Math.max(t, +plot.dataset.min + 1);
  return Math.min(t, x1);
}
function stopPicking() { state.picking = null; state.hoverT = null; render(); }
main.addEventListener("pointermove", e => {
  if (!state.picking) return;
  const plot = e.target.closest(".plot.pickable"), line = main.querySelector(".pick-line");
  if (!line) return;
  if (!plot) { line.hidden = true; state.hoverT = null; return; }
  const t = pickTime(plot, e), x0 = +plot.dataset.x0, x1 = +plot.dataset.x1;
  state.hoverT = t;
  line.hidden = false;
  line.style.left = ((t - x0) / Math.max(1, x1 - x0) * 100).toFixed(2) + "%";
  line.querySelector("span").textContent = `${plot.dataset.label} ${fmtTod(t)}`;
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.picking) stopPicking(); });

// open a snapshot (JSON)
// dark / light toggle. The choice is remembered in this browser (works without storage too)
const darkMq = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (darkMq.matches ? "dark" : "light")) === "dark";
function syncThemeButton() {
  const b = document.getElementById("theme"), dark = isDark();
  b.querySelector(".ic use").setAttribute("href", dark ? "#i-light_mode" : "#i-dark_mode");
  b.title = dark ? "Switch to light mode" : "Switch to dark mode";
  b.setAttribute("aria-label", b.title);
}
try { const t = localStorage.getItem("op-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (_) {}
syncThemeButton();
document.getElementById("theme").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("op-theme", t); } catch (_) {}
  syncThemeButton();
  render();   // charts read colors when drawn, so redraw
});
darkMq.addEventListener("change", () => { if (!document.documentElement.dataset.theme) { syncThemeButton(); render(); } });
// the session as a snapshot (the raw data; the GUI also writes about and summary first, see docs/views.md)
function rawSnapshot() {
  const names = [...new Set(chist.flatMap(e => Object.keys(e.count)))].sort();
  return { target: snap.target, sample: snap.sample, startedAt: new Date(startMs).toISOString(), durationSec: state.elapsed, cpu: snap.cpu,
    memory: { heapMaxMB: snap.memory.heapMaxMB, xmsMB: snap.memory.xmsMB, classes,
      history: chist.length ? { t: chist.map(e => e.t), classes: names, count: chist.map(e => names.map(c => e.count[c] ?? 0)), bytes: chist.map(e => names.map(c => e.bytes[c] ?? 0)) } : undefined },
    threads: threads.map(t => ({ name: t.name, segs: t.segs, stack: t.stack, sec: t.sec })),
    gc: gc ? { collector: gc.collector, heapMaxMB: gc.heapMaxMB, generations: gc.gen || undefined, events: gc.events } : undefined,
    telemetry: tel.t.length ? Object.fromEntries(TEL.map(k => [k, tel[k]])) : undefined };
}
document.getElementById("save").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(rawSnapshot(), null, 1)], { type: "application/json" }));
  a.download = `jvmeter-${snap.target.pid}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
// the snapshot's fields that hold text (Snapshot.java); any other field holds numbers, which the views put into HTML as they are,
// so a file with text there is refused. Arrays may hold text (stacks, thread names, segs' states).
const TEXT_FIELDS = new Set(["format", "name", "jvm", "include", "startedAt", "agent", "kind", "host", "runAs", "context", "namespace", "pod", "container",
  "pattern", "site", "cls", "state", "lock", "owner", "top", "cause", "collector"]);
function textWhereNumber(v) {
  if (Array.isArray(v)) { for (const x of v) { const bad = typeof x === "object" && textWhereNumber(x); if (bad) return bad; } return null; }
  if (!v || typeof v !== "object") return null;
  for (const [k, x] of Object.entries(v)) {
    if (typeof x === "string" && !TEXT_FIELDS.has(k)) return k;
    const bad = typeof x === "object" && textWhereNumber(x); if (bad) return bad;
  }
  return null;
}
document.getElementById("open").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s.target || !s.cpu || !s.cpu.tree || !s.memory || !Array.isArray(s.memory.classes)) throw new Error("target / cpu.tree / memory.classes are required");
    const notNumber = textWhereNumber({ ...s, about: undefined, summary: undefined });
    if (notNumber) throw new Error(`${notNumber} should be a number`);
    s.threads = s.threads || [];
    startSession(s);
  } catch (err) {
    const msg = `Could not open the snapshot: ${err.message}`;
    if (dlg.open) document.getElementById("cn-msg").textContent = msg;
    else main.insertAdjacentHTML("afterbegin", `<p class="err" role="alert">${esc(msg)}</p>`);
  }
  e.target.value = "";
});

// ---------- Start Center (simulated here; the GUI runs these commands with ProcessBuilder, see docs/targets.md) ----------
const JAR = "jvmeter-agent.jar";

const PREPARE = "-XX:+EnableDynamicAgentLoading -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints";
// sample JVMs until the agent can list them. args: JVM options (as jps -v shows them); port: the agent already runs in that JVM
const TARGETS = {
  local: { jvms: [
    { pid: 34567, name: "com.example.orders.OrderServiceApp", jvm: "OpenJDK 21.0.8", args: "-XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints -javaagent:jvmeter-agent.jar=port=7091", port: 7091 },
    { pid: 41877, name: "app.Mix", jvm: "OpenJDK 25", args: "-Xmx512m" },
    { pid: 40212, name: "org.gradle.launcher.daemon.bootstrap.GradleDaemon", jvm: "OpenJDK 17.0.12", args: "-Xmx2g -Dfile.encoding=UTF-8" } ] },
  // hosts: the Host entries of ~/.ssh/config (the GUI reads the file)
  ssh: { hosts: ["app@prod-api-1", "app@prod-api-2", "batch-1"], jvms: [
    { pid: 2211, name: "com.example.orders.OrderServiceApp", jvm: "OpenJDK 21.0.8", args: "-Xms1g -Xmx1g " + PREPARE },
    { pid: 2398, name: "com.example.orders.ReportJob", jvm: "OpenJDK 21.0.8", args: "-Xmx2g" } ] },
  // contexts, namespaces and pods: what kubectl reports (config get-contexts, get namespaces, get pods)
  kubectl: { contexts: ["prod-tokyo", "staging"], namespaces: ["default", "orders", "payments"], pods: ["orders-api-7f9c6d-x2x4q", "orders-api-7f9c6d-k8m1z", "orders-worker-5b8d4-q7tw2"], jvms: [
    { pid: 1, name: "com.example.orders.OrderServiceApp", jvm: "OpenJDK 21.0.8", args: "-XX:MaxRAMPercentage=75" } ] },
};
const NOTES = {
  local: "JVMs on this computer that run as your user. jvmeter loads the agent with the Attach API, or connects to an agent that is already running.",
  ssh: "Uses your own <b>ssh</b>, so keys, ssh-agent and ~/.ssh/config (ProxyJump too) apply; it cannot answer password prompts. The host needs java, and attaching works only as the JVM's user: set Run as to use sudo -u.",
  kubectl: "Uses your own <b>kubectl</b> and kubeconfig; RBAC must allow pods/exec and pods/portforward. The container needs sh (to receive the agent jar) and the jdk.attach module; otherwise start the JVM with the agent.",
};
const WHERE0 = { ssh: { host: "app@prod-api-1", runAs: "" }, kubectl: { context: "prod-tokyo", namespace: "orders", pod: "orders-api-7f9c6d-x2x4q", container: "app" } };
const cn = { include: "", incMode: "auto", custom: "", kind: "local", ssh: { ...WHERE0.ssh }, kubectl: { ...WHERE0.kubectl }, listed: null, pid: null, busy: false, err: "", hint: "" };
// the places used last time; the fields then keep what is typed while the page is open
{ const l = lastConn(); for (const k of ["ssh", "kubectl"]) if (l[k]) cn[k] = { ...WHERE0[k], ...l[k] }; }
const dlg = document.getElementById("connect");
const cnJvm = () => cn.listed && cn.listed.find(j => j.pid === cn.pid);
// the last connection: the Start Center opens where it left off (place, main class) and suggests the SSH hosts used before.
// Per-browser convenience (the GUI keeps it in its preferences); without storage it starts on Local
function lastConn() { try { return JSON.parse(localStorage.getItem("op-last")) || {}; } catch (_) { return {}; } }
function saveLast(kind, name) {
  const l = lastConn();
  l.kind = kind; l.name = { ...l.name, [kind]: name };
  l.include = { ...l.include, [name]: cn.include };
  if (kind !== "local") l[kind] = { ...cn[kind] };
  if (kind === "ssh") l.hosts = [cn.ssh.host, ...(l.hosts || []).filter(h => h !== cn.ssh.host)].slice(0, 8);
  try { localStorage.setItem("op-last", JSON.stringify(l)); } catch (_) {}
}
// a pod name changes with every rollout: keep the pod if it still exists, else take one of the same Deployment (name minus -<hash>-<suffix>)
function samePod(pods, pod) {
  const owner = p => p.replace(/-[a-z0-9]+-[a-z0-9]+$/, "");
  return pods.includes(pod) ? pod : pods.find(p => owner(p) === owner(pod)) || pods[0];
}

function cnField(key, label, opts = {}) {
  const v = esc(cn[cn.kind][key]), id = `cn-${key}`, cls = opts.wide ? ` class="wide"` : "";
  if (opts.select) return `<label for="${id}">${label}<select id="${id}" data-f="${key}"${cls}>${opts.select.map(o => `<option${o === cn[cn.kind][key] ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
  const dl = opts.list ? `<datalist id="${id}-l">${opts.list.map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : "";
  return `<label for="${id}">${label}<input id="${id}" data-f="${key}" value="${v}"${cls} placeholder="${esc(opts.ph || "")}" spellcheck="false" autocomplete="off"${opts.list ? ` list="${id}-l"` : ""}>${dl}</label>`;
}
// the whole dialog: only when it opens or the section changes (typing must not lose focus)
function renderConnect() {
  dlg.querySelectorAll("[data-kind]").forEach(b => b.setAttribute("aria-current", b.dataset.kind === cn.kind ? "page" : "false"));
  document.getElementById("cn-msg").textContent = "";
  const k = cn.kind, T = TARGETS[k], body = document.getElementById("cn-body");
  const hosts = [...new Set([...(lastConn().hosts || []), ...TARGETS.ssh.hosts])];
  const fields = k === "ssh" ? cnField("host", "Host", { wide: true, list: hosts, ph: "user@host or a Host in ~/.ssh/config" }) + cnField("runAs", "Run as (optional)", { ph: "the JVM's user" })
    : k === "kubectl" ? cnField("context", "Context", { select: T.contexts }) + cnField("namespace", "Namespace", { select: T.namespaces }) + cnField("pod", "Pod", { select: T.pods, wide: true }) + cnField("container", "Container")
    : "";
  body.innerHTML = `
    <p class="note" style="margin:0">${NOTES[k]}</p>
    <div class="cn-fields">${fields}<button type="button" class="btn" id="cn-list"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>${k === "local" ? "Refresh" : "List JVMs"}</button></div>
    <div class="cn-list" id="cn-jvms" aria-live="polite"></div>
    <div class="cn-fields" id="cn-inc"></div>`;
  renderConnectParts();
}
function renderConnectParts() {
  const j = cnJvm(), notes = attachNotes(j), refocus = document.activeElement && document.activeElement.name === "cn-jvm";
  document.getElementById("cn-jvms").innerHTML = cn.busy ? `<p class="empty">Listing JVMs${cn.kind === "local" ? "" : " on " + esc(cnWhere())}…</p>`
    : cn.err ? `<p class="empty err" role="alert">${esc(cn.err)}</p>`
    : !cn.listed ? `<p class="empty">Enter where the JVM runs, then choose List JVMs.</p>`
    : `${cn.hint ? `<p class="cn-hint" role="status">${esc(cn.hint)}</p>` : ""}<table><thead><tr><th style="width:28px"></th><th class="r">PID</th><th>Main class</th><th>JVM</th><th>Agent</th></tr></thead><tbody>${cn.listed.map(x => `
      <tr class="row" data-cnpid="${x.pid}" aria-selected="${x.pid === cn.pid}">
        <td><input type="radio" name="cn-jvm" value="${x.pid}"${x.pid === cn.pid ? " checked" : ""} aria-label="${esc(x.name)}, pid ${x.pid}"></td>
        <td class="r">${x.pid}</td><td class="mc" title="${esc(x.name)}">${esc(x.name)}</td><td>${esc(x.jvm)}</td>
        <td>${x.port ? `<span class="badge ok">Running · port ${x.port}</span>` : `<span class="note">Not loaded</span>`}</td></tr>`).join("")}</tbody></table>`;
  // how the packages whose calls are counted are chosen: the app's (auto), typed ones, or all
  const inc = document.getElementById("cn-inc");
  inc.hidden = !j;
  if (j && document.activeElement && document.activeElement.id !== "cn-include") {
    const opt = (m, label) => `<label class="cn-preset"><input type="radio" name="cn-incmode" value="${m}"${cn.incMode === m ? " checked" : ""}>${label}</label>`;
    inc.innerHTML = `<span class="cn-inc-label">Count calls in</span>${opt("auto", "Application packages")}${opt("custom", "Custom packages")}${opt("all", "All methods")}`
      + (cn.incMode === "custom" ? `<div class="cn-fields"><label for="cn-include"><input id="cn-include" class="xwide" value="${esc(cn.custom)}" placeholder="packages, e.g. com.example" spellcheck="false" autocomplete="off"></label>
      <span class="note">Packages, comma-separated. CPU time is sampled in every method; calls are counted in these.</span></div>` : "");
  }
  document.getElementById("cn-foot").innerHTML = `
    ${notes.length ? `<span class="note" title="${esc(notes.join(" "))}"><svg class="ic${notes.length > 1 ? "" : " info"}" aria-hidden="true"><use href="#i-${notes.length > 1 ? "warning" : "info"}-fill"/></svg><span>${esc(notes[0])}</span></span>` : `<span class="spacer"></span>`}
    <button type="button" class="btn" id="cn-cancel">Cancel</button>
    <button type="button" class="btn primary" id="cn-go"${j ? "" : " disabled"}>${j && !j.port ? "Attach and connect" : "Connect"}</button>`;
  if (refocus) dlg.querySelector("input[name=cn-jvm]:checked").focus();   // arrow keys in the radio group keep focus
}
// the packages whose calls are counted, for a main class: what was used for it last time ("*": All), or its own package
const includeFor = name => ((lastConn().include || {})[name]) ?? (name.includes(".") ? name.slice(0, name.lastIndexOf(".")) : name);
// the include value the preset resolves to (auto/custom share cn.include; "*" for All)
const incValue = () => cn.incMode === "all" ? "*" : cn.incMode === "custom" ? cn.custom.trim() : cn.include;
function shortClass(n) { return n.slice(n.lastIndexOf(".") + 1); }
function cnWhere() { const f = cn[cn.kind]; return cn.kind === "ssh" ? f.host : viaLabel({ kind: cn.kind, ...f }); }
const dns = j => j.args.includes("-XX:+DebugNonSafepoints");
// JDK 21+ warns when an agent is loaded into a running JVM, and a later release refuses it, unless this option was given (JEP 451)
const warnsOnAttach = j => +(j.jvm.match(/\d+/) || [0])[0] >= 21 && !j.args.includes("-XX:+EnableDynamicAgentLoading");
// what attaching to j means: the pause, and the options that make it silent and exact; none when j's agent runs
function attachNotes(j) {
  if (!j || j.port) return [];
  return ["Attaching pauses the JVM briefly to instrument the loaded classes.",
    ...(dns(j) && !warnsOnAttach(j) ? [] : [`Start the JVM with ${PREPARE} for a silent attach with exact times.`])];
}
// prefer: the main class used last time here; it is selected again, or the list says why it cannot be
function cnList(prefer) {
  const f = cn[cn.kind];
  cn.err = cn.kind === "ssh" && !f.host.trim() ? "Enter a host." : cn.kind === "kubectl" && !(f.namespace.trim() && f.container.trim()) ? "Enter a namespace and a container." : "";
  cn.listed = null; cn.pid = null; cn.busy = !cn.err; cn.hint = "";
  renderConnectParts();
  const kind = cn.kind;
  if (cn.busy) setTimeout(() => {
    if (cn.kind !== kind) return;
    cn.busy = false; cn.listed = TARGETS[kind].jvms;
    const same = prefer ? cn.listed.filter(j => j.name === prefer) : [];
    cn.pid = (same[0] || cn.listed[0]).pid; cnInclude(cnJvm().name);
    if (prefer && same.length !== 1) cn.hint = same.length ? `${same.length} JVMs run ${shortClass(prefer)} here: choose one.` : `No JVM runs ${shortClass(prefer)} here now: choose another one.`;
    renderConnectParts();
  }, 500);
}
// a section lists its JVMs at once when it is Local or was used before (one place, the one last used there)
function cnShow(kind) {
  cn.kind = kind; cn.listed = null; cn.pid = null; cn.err = ""; cn.busy = false; cn.hint = "";
  if (kind === "kubectl") cn.kubectl.pod = samePod(TARGETS.kubectl.pods, cn.kubectl.pod);
  renderConnect();
  const prefer = (lastConn().name || {})[kind];
  if (kind === "local" || prefer) cnList(prefer);
}
function startSession(s) {
  clearInterval(timer); timer = null; state.recording = false;
  load(s); state.view = "overview";
  if (dlg.open) dlg.close();
  render();
}
function cnConnect() {
  const j = cnJvm(); if (!j) return;
  const s = structuredClone(SAMPLE), where = cn.kind === "local" ? null : { ...cn[cn.kind] };
  if (where && !where.runAs) delete where.runAs;
  s.target = { name: j.name, pid: j.pid, jvm: j.jvm, agent: j.port ? "startup" : "attach", debugNonSafepoints: dns(j) };
  if (where) s.target.via = { kind: cn.kind, ...where };
  saveLast(cn.kind, j.name);
  j.port = j.port || 38211;   // the agent stays loaded; the next connect finds it running
  startSession(s);
  // connecting to a JVM starts a recording, as in the GUI
  state.recording = true; timer = setInterval(tick, 1000); render();
}
function openStart() {
  const l = lastConn();
  cnShow(snap ? (snap.target.via ? snap.target.via.kind : "local") : l.kind || "local");
  dlg.showModal();
  dlg.querySelector('.cn-nav [aria-current="page"]').focus();
}
document.getElementById("target").addEventListener("click", openStart);
// actions shared by the Start Center and the empty window
function startAction(a) {
  if (a === "open") document.getElementById("open").click();
  else if (a === "sample") startSession(structuredClone(SAMPLE));
  else if (a === "start") openStart();
}
main.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) startAction(b.dataset.act); });
dlg.addEventListener("click", e => {
  const kb = e.target.closest("[data-kind]"); if (kb) return cnShow(kb.dataset.kind);
  const act = e.target.closest("[data-act]"); if (act) return startAction(act.dataset.act);
  if (e.target.closest("#cn-list")) return cnList();
  if (e.target.closest("#cn-go")) return cnConnect();
  if (e.target.closest("#cn-cancel") || e.target === dlg) return dlg.close();   // e.target === dlg: a click on the backdrop
  const row = e.target.closest("[data-cnpid]"); if (row) { cn.pid = +row.dataset.cnpid; cnInclude(cnJvm().name); renderConnectParts(); }
  const preset = e.target.closest("input[name=cn-incmode]"); if (preset) { cn.incMode = preset.value; cn.include = incValue(); renderConnectParts(); }
});
// a JVM was chosen: the preset used for its main class last time ("*": All), else its own package
function cnInclude(name) { const s = includeFor(name); cn.incMode = s === "*" ? "all" : "auto"; if (s !== "*") cn.custom = s; cn.include = incValue(); }
dlg.addEventListener("dblclick", e => { if (e.target.closest("[data-cnpid]")) cnConnect(); });
// typing changes where the JVM runs: the listed JVMs belong to the old place
dlg.addEventListener("input", e => {
  if (e.target.id === "cn-include") { cn.custom = e.target.value; cn.include = incValue(); renderCmds(); return; }
  const k = e.target.dataset.f; if (!k) return;
  cn[cn.kind][k] = e.target.value; cn.listed = null; cn.pid = null; cn.err = ""; cn.hint = "";
  renderConnectParts();
});

// like JProfiler, the Start Center opens first. #sample starts with the sample instead (gui/compare uses it)
if (location.hash === "#sample") load(SAMPLE);
render();
if (!snap) openStart();
</script>
