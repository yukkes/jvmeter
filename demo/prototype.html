<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jvmeter</title>
<meta name="description" content="jvmeter: CPU hot spots and call tree, heap and class diffs, GCeasy-style GC analysis, and thread states of a profiled JVM.">
<link rel="icon" href="data:,">
<!-- Inter from Google Fonts, the font the GUI bundles. Loaded without blocking the first paint; offline the page uses the system font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" onload="this.rel='stylesheet'">
<style>
/* Layout: top bar (target JVM, recording) + left icon rail (4 views) + main. On narrow screens the rail moves to the bottom */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --sunken: #eef1f5;
  --fg: #18212c;
  --muted: #5d6978;
  --line: #d9dee5;
  --accent: #2563c9;
  --accent-soft: #e3ecfa;
  --rec: #d93b30;
  --run: #2f9e55;
  --wait: #d9a420;
  --block: #d93b30;
  --io: #3b82d6;
  --bar: #e8775f;
  --bar-self: #b9361f;
  --good: #1f7a3f;
  --limit: #0e7490;   /* reference lines (-Xmx / -Xms) */
  --event: #d97706;   /* events (Full GC): an attention color kept apart from data (green/blue) and reference lines (cyan) */
  --bad: #c9362b;
  --on-bad: #ffffff;
  --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "DejaVu Sans", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --surface: #171c23; --sunken: #1e252e; --fg: #e4e9ef; --muted: #96a2b0;
    --line: #2a323d; --accent: #78a6f2; --accent-soft: #1f2e45; --rec: #f0645a;
    --run: #4cc074; --wait: #e6b93a; --block: #f0645a; --io: #64a2ec;
    --bar: #d9715b; --bar-self: #f09a85; --good: #4cc074; --bad: #f0645a; --on-bad: #0f1318; --limit: #22d3ee; --event: #f59e0b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #171c23; --sunken: #1e252e; --fg: #e4e9ef; --muted: #96a2b0;
  --line: #2a323d; --accent: #78a6f2; --accent-soft: #1f2e45; --rec: #f0645a;
  --run: #4cc074; --wait: #e6b93a; --block: #f0645a; --io: #64a2ec;
  --bar: #d9715b; --bar-self: #f09a85; --good: #4cc074; --bad: #f0645a; --on-bad: #0f1318; --limit: #22d3ee; --event: #f59e0b;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
/* icons: Material Symbols Rounded as inline SVG (sprite at the top of <body>, same paths as the Java GUI) */
.ic { width: 1em; height: 1em; font-size: 20px; display: inline-block; vertical-align: middle; fill: currentColor; flex: none; }
/* numbers: tabular forms (font-feature-settings, unlike font-variant-numeric, survives a font shorthand on the same element) */
.num { font-family: var(--font); font-feature-settings: "tnum"; }

.app { height: 100%; display: grid; grid-template-columns: 72px 1fr; grid-template-rows: auto 1fr; grid-template-areas: "top top" "rail main"; }

/* top bar */
/* quiet chrome: brand / target as a breadcrumb, then the recording and frameless icon buttons */
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; line-height: 20px; }
.brand .ic { font-size: 22px; color: var(--accent); }
.crumb { color: var(--line); font-size: 22px; line-height: 20px; margin: 0 2px; }
/* the target: its name with pid and JVM below; it opens the Start Center (the chevron) */
.target { display: flex; align-items: center; gap: 10px; padding: 3px 6px 3px 8px; border: 0; border-radius: 8px; background: none; min-width: 0; }
.target .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.target .tt { display: grid; min-width: 0; text-align: left; line-height: 18px; }
.target b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.target .sub { display: flex; gap: 4px; min-width: 0; overflow: hidden; color: var(--muted); font-size: 12px; line-height: 16px; white-space: nowrap; }
button.target { font: inherit; color: inherit; cursor: pointer; }
button.target:hover { background: var(--sunken); }
button.target:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.target > .ic { font-size: 18px; color: var(--muted); }
button.target:hover > .ic { color: var(--fg); }
/* no JVM yet: the target asks to connect */
.target.no-jvm, button.target.no-jvm:hover { background: var(--accent-soft); }
.target.no-jvm b, .target.no-jvm > .ic, button.target.no-jvm:hover > .ic { color: var(--accent); }
.top .btn { height: 32px; box-sizing: border-box; padding-top: 5px; padding-bottom: 5px; }
.top .btn.icon { width: 32px; justify-content: center; padding: 5px; }
.top .btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.top .btn.ghost:hover { background: var(--sunken); color: var(--fg); }
.top .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.vsep { width: 1px; height: 20px; margin: 0 6px; background: var(--line); }
/* recording: one button that shows the time; red tint while recording */
.top .btn.recbtn { gap: 6px; padding-left: 10px; padding-right: 10px; font-feature-settings: "tnum"; }
.recbtn .ic { font-size: 18px; color: var(--rec); }
.top .btn.recbtn.on { background: color-mix(in srgb, var(--rec) 12%, transparent); color: var(--rec); font-weight: 700; }
/* sample data: a status, not a control (an M3 tonal container): filled, no outline, smaller than the buttons */
#sample-badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; box-sizing: border-box; padding: 0 10px 0 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font: 500 13px/20px var(--font); }
#sample-badge .ic { font-size: 18px; }
#t-via { display: inline-flex; align-items: center; gap: 4px; font-feature-settings: "calt" 0; }
#t-via .ic { font-size: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--fg)); }

/* Start Center: shown at startup and from the target in the top bar. Left: where to start (local, SSH, Kubernetes, a snapshot,
   the sample); right: the JVMs there and the commands jvmeter runs (docs/targets.md) */
dialog.connect { width: min(920px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); box-sizing: border-box; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); box-shadow: 0 16px 48px rgba(0,0,0,.28); }
dialog.connect[open] { display: flex; flex-direction: column; }
dialog.connect::backdrop { background: rgba(15, 20, 28, .45); }
.cn-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line); }
.cn-head h2 { font-size: 16px; line-height: 24px; margin: 0; }
.cn-wrap { display: grid; grid-template-columns: 180px minmax(0, 1fr); min-height: 0; flex: 1; }
.cn-nav { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; border-right: 1px solid var(--line); }
.cn-nav button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--muted); font: 500 13px/20px var(--font); text-align: left; cursor: pointer; white-space: nowrap; }
.cn-nav button:hover { background: var(--sunken); }
.cn-nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.cn-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cn-nav hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.cn-nav .err { margin: 6px 4px 0; }
.cn-main { display: flex; flex-direction: column; min-height: 470px; min-width: 0; overflow: auto; }
@media (max-width: 720px) {
  .cn-wrap { grid-template-columns: 1fr; }
  .cn-nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .cn-nav hr { display: none; }
  .cn-main { min-height: 0; }
}
.cn-body { display: grid; gap: 12px; padding: 12px 16px 4px; }
.cn-fields { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; }
.cn-fields label { display: grid; gap: 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
/* calt off: Inter would draw the x of a pod name like x2x4q as a multiplication sign */
.cn-fields input, .cn-fields select { font: 13px/20px var(--font); font-feature-settings: "calt" 0; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; width: 110px; height: 32px; box-sizing: border-box; }
.cn-fields input:focus-visible, .cn-fields select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cn-fields .wide { width: 200px; }
.cn-fields .xwide { width: 280px; }
#cn-inc { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
#cn-inc .cn-inc-label { font-size: 12px; color: var(--muted); }
#cn-inc .cn-preset { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg); cursor: pointer; }
#cn-inc .cn-preset input[type="radio"] { width: 16px; height: 16px; margin: 0; padding: 0; accent-color: var(--accent); flex: none; }
#cn-inc .cn-fields { flex-basis: 100%; }
#cn-inc .note { margin: 0; padding-bottom: 6px; flex: 1; min-width: 200px; }
#cn-foot .note { margin-right: auto; flex: 1 1 260px; display: flex; gap: 6px; align-items: center; min-width: 0; }
#cn-foot .note > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cn-foot .note .ic { font-size: 16px; color: var(--wait); flex: none; }
#cn-foot .note .ic.info { color: var(--accent); }
.cn-list { border: 1px solid var(--line); border-radius: 8px; max-height: 210px; overflow: auto; }
.cn-list td.r { font-feature-settings: "tnum"; }
.cn-list .empty { padding: 14px; }
.cn-hint { margin: 0; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 20px; background: color-mix(in srgb, var(--wait) 14%, transparent); }
/* the main class takes the remaining width and shortens with an ellipsis (the full name is in the title) */
.cn-list td.mc { max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; }
.badge.ok { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--fg); }
.cn-body details { font-size: 13px; line-height: 20px; }
.cn-body summary { cursor: pointer; color: var(--muted); }
.cn-body pre { margin: 6px 0 0; padding: 10px 12px; background: var(--sunken); border-radius: 8px; font: 12px/18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.cn-body pre .cm { color: var(--muted); }
.nw { white-space: nowrap; }
.cn-foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px 16px; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/20px var(--font); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { background: var(--sunken); }
.btn:focus-visible, .seg button:focus-visible, .rail button:focus-visible, .row:focus-visible, .tl-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.icon { padding: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 13px/20px var(--font); color: var(--muted); background: var(--surface); border: 0; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); display: inline-block; }

/* left rail */
.rail { grid-area: rail; display: flex; flex-direction: column; gap: 4px; padding: 10px 7px 10px 8px; background: var(--surface); border-right: 1px solid var(--line); }
.rail button { display: grid; justify-items: center; gap: 2px; padding: 8px 0; border: 0; border-radius: 10px; background: none; color: var(--muted); cursor: pointer; font: 500 11px/16px var(--font); }
.rail button .ic { font-size: 24px; }
.rail button:hover { background: var(--sunken); }
.rail button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.rail button:disabled { opacity: .45; cursor: default; background: none; }
.target .dot.off { background: var(--muted); }
/* no JVM yet: what the window shows behind (or after closing) the Start Center */
.welcome { display: grid; place-items: center; min-height: 60vh; }
.welcome .panel { max-width: 520px; padding: 28px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.welcome .panel > .ic { font-size: 40px; color: var(--accent); }
.welcome h1 { font-size: 18px; line-height: 28px; margin: 0; }
.welcome p { margin: 0; }
.welcome .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 6px; }

main { grid-area: main; overflow: auto; padding: 18px 20px 28px; min-width: 0; }
/* wide windows: the content stops at 1600px and stays centered, so rows and tables do not stretch apart */
main > * { width: 100%; max-width: 1600px; margin-inline: auto; box-sizing: border-box; }
/* CPU view and GC analysis: fill the space below the heading; the main column and the side panel scroll on their own */
main.fill { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 20px; }
main.fill > .split { flex: 1; min-height: 0; align-items: stretch; }
main.fill > .split > .panel:first-child { display: flex; flex-direction: column; min-height: 0; }
main.fill > .split > .side, main.fill > .split > .gc-main { overflow: auto; min-height: 0; }
main.fill .scroll-y { flex: 1; max-height: none; min-height: 0; }
/* in the single-column layout the details move below, so use normal page scrolling */
@media (max-width: 1000px) { main.fill { display: block; overflow: auto; } }
/* min-height = button height, so the title stays at the same place on every view (with or without buttons) */
.view-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; min-height: 34px; }
.view-head h1 { font-size: 18px; line-height: 28px; margin: 0; margin-right: auto; }
.note { font-size: 12px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.badge.warn { background: color-mix(in srgb, var(--wait) 20%, transparent); color: var(--fg); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel h2 { font-size: 13px; line-height: 20px; font-weight: 700; margin: 0; padding: 12px 14px 0; display: flex; align-items: center; gap: 6px; }

/* overview */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; margin-bottom: 14px; }
.tile { padding: 12px 14px 8px; display: grid; gap: 2px; }
.tile .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .value { font-size: 22px; font-weight: 700; }
.tile .sub { font-size: 12px; color: var(--muted); }
.tile svg:not(.ic) { width: 100%; height: 48px; display: block; margin-top: 4px; }
/* overview tiles are buttons that open the detailed view */
button.tile { font: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer; }
button.tile .go { margin-left: auto; font-size: 18px; color: var(--muted); opacity: .55; }
button.tile:hover { border-color: var(--accent); }
button.tile:hover .go { color: var(--accent); opacity: 1; }
button.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.insights { display: grid; gap: 0; }
.insight { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.insight:first-of-type { border-top: 0; }
.insight .ic { color: var(--accent); }
.insight.warn .ic { color: var(--bad); }
.insight p { margin: 0; min-width: 0; overflow: hidden; line-height: 20px; }
.insight small { color: var(--muted); display: block; font-size: 12px; line-height: 18px; }
.link { font: 500 13px/18px var(--font); color: var(--accent); background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
.link:hover { background: var(--accent-soft); }

/* tables */
/* the detail panel grows with the window (call counts can have many digits) */
.split { display: grid; grid-template-columns: minmax(0, 1fr) round(up, clamp(340px, 30%, 480px), 1px); gap: 14px; align-items: start; }
@media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }
.tbl-wrap { overflow-x: auto; }
/* lists scroll inside the table (sticky header). Height = window minus top bar, heading and notes */
.scroll-y { overflow: auto; max-height: calc(100vh - 230px); max-height: calc(100dvh - 230px); min-height: 200px; overscroll-behavior: contain; }
@media (max-width: 720px) { .scroll-y { max-height: calc(100dvh - 300px); } }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; line-height: 16px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; z-index: 1; background: var(--surface); }
th.r, td.r { text-align: right; }
th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
th button:focus-visible { outline: 2px solid var(--accent); }
.sort-ic { font-size: 16px !important; }
.asc .sort-ic { transform: rotate(180deg); }
th[aria-sort] button, .thead button[aria-pressed="true"] { color: var(--fg); }
.thead button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.thead button:focus-visible { outline: 2px solid var(--accent); }
.thead span:not(:first-child) { display: flex; justify-content: flex-end; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; line-height: 16px; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--sunken); }
tr.row[aria-selected="true"] td { background: var(--accent-soft); }
/* long names: shorten the package with an ellipsis first and keep Class.method; the full name is in the title */
.m { font-family: var(--font); font-size: 13px; line-height: 16px; display: inline-flex; max-width: 100%; min-width: 0; vertical-align: bottom; }
.m .pkg { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 2ch; }
.m .cm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
/* the package shrinks first; Class.method only once the package is down to 2ch */
.m .pkg + .cm { flex-shrink: 0; max-width: calc(100% - 2ch); }
/* the name column takes the remaining width, numeric columns are fixed; on narrow screens the table scrolls horizontally */
table.fixed { table-layout: fixed; min-width: 560px; }
table.fixed td.mcell { overflow: hidden; }
/* numeric columns fit their content automatically and the name column takes the rest (no manual resizing) */
.tree-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.meter { display: inline-block; width: 64px; height: 8px; border-radius: 2px; background: var(--sunken); position: relative; vertical-align: middle; margin-right: 8px; overflow: hidden; }
td .meter { vertical-align: top; margin-top: 4px; }
/* in a right-aligned number cell the meter stays at the left edge, so bars line up whatever the number's length */
td.r .meter { float: left; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--bar); }
.meter i + i { background: var(--bar-self); }
.plus { color: var(--bad); } .minus { color: var(--good); }

/* call tree */
.tree { padding: 6px 0; overflow-x: auto; }
.trow { display: grid; grid-template-columns: minmax(200px, 1fr) var(--c1, 110px) var(--c2, 100px) var(--c3, 100px); align-items: center; min-height: 30px; padding-right: 10px; cursor: pointer; font-size: 13px; line-height: 20px; }
.trow:hover { background: var(--sunken); }
.trow[aria-selected="true"] { background: var(--accent-soft); }
.trow .name { display: flex; align-items: center; gap: 4px; min-width: 0; white-space: nowrap; overflow: hidden; }
.trow .name .m { flex: 0 1 auto; }
.trow .name > :not(.m) { flex: none; }
.trow .tog { width: 22px; height: 22px; display: grid; place-items: center; color: var(--muted); border: 0; background: none; cursor: pointer; border-radius: 4px; flex: none; }
.trow .tog[aria-expanded="false"] .ic { transform: rotate(-90deg); }
.trow .tog.leaf { visibility: hidden; }
.thead { display: grid; grid-template-columns: minmax(200px, 1fr) var(--c1, 110px) var(--c2, 100px) var(--c3, 100px); padding: 6px 10px 6px 14px; border-bottom: 1px solid var(--line); font-size: 12px; line-height: 18px; color: var(--muted); }
.thead span:not(:first-child), .trow .c { text-align: right; }
mark { background: color-mix(in srgb, var(--wait) 45%, transparent); color: inherit; border-radius: 2px; }

.side { padding-bottom: 12px; }
.side h3 { font-size: 12px; color: var(--muted); font-weight: 500; margin: 14px 14px 6px; }
.side .title { font-family: var(--font); font-size: 13px; padding: 4px 14px 0; overflow-wrap: anywhere; }
.detail .empty b { color: var(--fg); }
.d-head { padding: 14px 14px 4px; }
.side h2.d-name { margin: 0; padding: 0; display: block; }
.d-name { font-family: var(--font); font-size: 15px; line-height: 22px; font-weight: 500; overflow-wrap: anywhere; }
.d-pkg { font-family: var(--font); font-size: 12px; line-height: 17px; color: var(--muted); overflow-wrap: anywhere; }
.d-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 10px 14px 0; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
/* one item per line: label | value share */
.d-stats > div { background: var(--surface); padding: 5px 10px; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.d-stats span { font-size: 12px; line-height: 17px; color: var(--muted); margin-right: auto; white-space: nowrap; }
.d-stats b { font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap; }
.d-stats small { font-size: 11px; line-height: 16px; color: var(--muted); white-space: nowrap; }
.d-bar { display: flex; height: 10px; margin: 0 14px 8px; border-radius: 3px; overflow: hidden; background: var(--sunken); }
.d-bar i { display: block; height: 100%; }
.d-list { list-style: none; margin: 0; padding: 0 8px; display: grid; gap: 1px; }
.d-list li { display: grid; grid-template-columns: auto 1fr auto 42px; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; font-size: 13px; line-height: 18px; }
.d-list.callers li { grid-template-columns: 1fr auto 42px; row-gap: 3px; }
.d-list .dot { width: 8px; height: 8px; border-radius: 2px; }
.d-list .lbl { font-family: var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.d-list .share { color: var(--muted); text-align: right; }
.d-list .minibar { grid-column: 1 / -1; height: 4px; background: var(--sunken); border-radius: 2px; overflow: hidden; }
.d-list .minibar i { display: block; height: 100%; background: var(--accent); opacity: .7; }
.d-list li.pick { cursor: pointer; }
.d-list li.pick:hover { background: var(--sunken); }
.d-list li.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.d-list li.more { color: var(--muted); font-size: 12px; line-height: 18px; display: block; }
.d-actions { padding: 12px 14px 0; }
.paths { list-style: none; margin: 0; padding: 0 14px; display: grid; gap: 8px; }
.paths li { font-family: var(--font); font-size: 12px; line-height: 18px; background: var(--sunken); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere; }
.paths li b { font-family: var(--font); display: block; font-size: 12px; margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; padding: 0 14px; font-size: 13px; line-height: 20px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
.empty { color: var(--muted); padding: 18px 14px; font-size: 13px; line-height: 20px; }

.search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--surface); }
.search input { border: 0; outline: 0; background: none; font: 13px/20px var(--font); padding: 0; color: var(--fg); width: 180px; max-width: 40vw; }
.search .ic { color: var(--muted); font-size: 18px; }

/* memory */
.chart { padding: 6px 14px 12px; }
.chart svg:not(.ic) { width: 100%; height: 152px; display: block; }

.tree-tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 10px 4px; }

/* GC analysis */
/* GC analysis: the main column (summary, KPIs, heap chart, pauses, causes, generations) and the detected problems
   in the side panel, like the CPU method details */
.gc-main, .th-main { display: grid; gap: 14px; align-content: start; min-width: 0; }
.gc-main > .note { margin: 0; }
.gc-sum { display: flex; align-items: center; gap: 10px; margin-block: -6px 12px; }
.gc-sum p { margin: 0; flex: 1; min-width: 0; }
/* the heading keeps the same controls on both Memory tabs (tabs, Run GC); a tab's own buttons sit in its panels */
.panel h2 .h2-tools { margin-left: auto; display: flex; gap: 8px; }
.gc-row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .gc-row2 { grid-template-columns: 1fr; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 12px; }
.kpi { padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.kpi .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kpi .label .ic { margin-left: auto; font-size: 20px; }
.kpi .value { font-size: 22px; font-weight: 700; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.good .label .ic, .kpi.good .sub { color: var(--good); }
.kpi.bad .label .ic, .kpi.bad .sub { color: var(--bad); }
.kpi.warn .label .ic { color: var(--wait); }

.problems { display: grid; gap: 8px; padding: 10px 12px 12px; }
.problem { display: grid; grid-template-columns: 24px 1fr; gap: 4px 10px; padding: 10px 12px; border-radius: 8px; }
.problem .ic { grid-row: span 3; font-size: 22px; align-self: start; }
.problem b { font-weight: 700; }
.problem p { margin: 0; font-size: 13px; line-height: 19px; color: var(--muted); }
.problem .link { justify-self: start; padding: 2px 0; }
.problem.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); } .problem.bad .ic { color: var(--bad); }
.problem.warn { background: color-mix(in srgb, var(--wait) 16%, transparent); } .problem.warn .ic { color: var(--wait); }
.problem.info { background: var(--accent-soft); } .problem.info .ic { color: var(--accent); }
.problem.ok { background: color-mix(in srgb, var(--good) 12%, transparent); } .problem.ok .ic { color: var(--good); }
.gc-chart { padding: 10px 14px 4px; }
.gc-chart svg:not(.ic) { width: 100%; height: 200px; display: block; }
/* charts with axes: the SVG is stretched horizontally, so tick labels are HTML outside it */
.axis-chart { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto auto; column-gap: 8px; }
.axis-chart .y-title { grid-column: 1; grid-row: 1; font-size: 11px; line-height: 16px; color: var(--muted); text-align: right; margin-bottom: 2px; }
.axis-chart .y-axis { grid-column: 1; grid-row: 2; position: relative; min-width: 38px; margin-bottom: 1px; }
.axis-chart .plot { grid-column: 2; grid-row: 2; border-left: 1px solid var(--muted); border-bottom: 1px solid var(--muted); }
.axis-chart .x-axis { grid-column: 2; grid-row: 3; position: relative; height: 26px; }
.axis-chart .x-title { grid-column: 2; grid-row: 4; font-size: 11px; line-height: 16px; color: var(--muted); text-align: center; }
.axis-chart .y-axis span, .axis-chart .x-axis > span:not(.gc-mark) { position: absolute; font: 11px/14px var(--font); color: var(--muted); white-space: nowrap; }
.axis-chart .y-axis span { right: 0; transform: translateY(-50%); }
.axis-chart .x-axis > span:not(.gc-mark) { top: 12px; transform: translateX(-50%); }
.axis-chart .plot { position: relative; }
/* draw overflow so the -Xmx line at the top edge is not half-clipped (and does not look thinner) */
.axis-chart .plot svg:not(.ic) { overflow: visible; }
/* labels of the -Xmx / -Xms lines (both above their line; -Xmx at the top sits outside the plot, level with "MB") */
.axis-chart .hlim { position: absolute; right: 6px; transform: translateY(calc(-100% - 1px)); font: 11px/14px var(--font); color: var(--limit); background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 0 4px; border-radius: 3px; pointer-events: none; white-space: nowrap; }
/* Full GC: a dashed vertical line across the plot at that time (drawn in the SVG) and a trash icon just below the time axis
   (it may overlap the tick labels, which move up) */
.axis-chart .gc-mark { position: absolute; top: 1px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; color: var(--event); cursor: help; }
.axis-chart .gc-mark .ic { font-size: 21px; line-height: 1; }
.axis-chart.gc-below .x-axis { height: 24px; }
.axis-chart.gc-below .x-axis > span:not(.gc-mark) { top: 3px; }
.gc-legend .gc-txt { font-size: 15px; color: var(--event); margin-right: 3px; line-height: 1; vertical-align: -3px; }
.axis-chart .mark-label { position: absolute; top: 2px; transform: translateX(-50%); font: 700 11px var(--font); color: var(--on-bad); background: var(--bad); padding: 0 5px; border-radius: 3px; }
/* picking a reference point: dim everything except the chart and pick a time with a red vertical line */
.pick-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15, 20, 28, .45); max-width: none; margin: 0; }
.pick-target { position: relative; z-index: 60; box-shadow: 0 0 0 2px var(--bad), 0 12px 32px rgba(0,0,0,.25); }
/* keep the layout while picking: the hint replaces the heading note and Cancel overlays the top right */
.pick-hint { color: var(--fg); font-weight: 400; }
.pick-hint b { color: var(--bad); }
.pick-cancel { position: absolute; top: 7px; right: 10px; padding: 3px 10px; font-size: 12px; }
.plot.pickable { cursor: crosshair; }
.pick-line { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--bad); pointer-events: none; }
.pick-line span { position: absolute; top: -2px; left: 4px; background: var(--bad); color: var(--on-bad); font: 11px var(--font); padding: 0 5px; border-radius: 3px; white-space: nowrap; }
.pick-block { position: absolute; top: 0; bottom: 0; left: 0; pointer-events: none; background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--muted) 28%, transparent) 0 6px, transparent 6px 12px); }
.ab-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; line-height: 19px; color: var(--muted); padding: 4px 14px 0; }
.ab-chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font); color: var(--fg); }
.ab-chip b { font-family: var(--font); color: var(--on-bad); background: var(--bad); border-radius: 3px; padding: 0 5px; font-size: 11px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.gc-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); padding: 0 14px 12px; }
.gc-legend i { display: inline-block; width: 14px; height: 4px; margin-right: 6px; vertical-align: 3px; }
.hist { padding: 8px 14px 12px; }
.hist svg { width: 100%; height: 170px; display: block; }
.gens { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 24px; padding: 12px 14px 14px; }
.gen-head { display: flex; justify-content: space-between; font-size: 13px; line-height: 20px; }
.gen-bar { height: 10px; border-radius: 3px; background: var(--sunken); overflow: hidden; margin-top: 4px; }
.gen-bar i { display: block; height: 100%; background: var(--accent); }
.gen-bar i.hi { background: var(--wait); }
.copy-fallback { width: 100%; height: 140px; font: 11px var(--font); margin-top: 8px; background: var(--sunken); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }

/* threads */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tl { padding: 8px 14px 14px; overflow-x: auto; }
.tl-row { display: grid; grid-template-columns: 210px minmax(360px, 1fr) 70px; gap: 12px; align-items: center; min-height: 30px; }
.tl-name { font-family: var(--font); font-size: 12px; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; border: 0; background: none; color: var(--fg); text-align: left; padding: 4px 6px; border-radius: 6px; }
.tl-name[aria-pressed="true"] { background: var(--accent-soft); }
.tl-bar { position: relative; height: 14px; background: var(--sunken); border-radius: 3px; overflow: hidden; cursor: pointer; }
.tl-bar span { position: absolute; top: 0; bottom: 0; }
.tl-axis { display: flex; justify-content: space-between; font-size: 11px; line-height: 16px; color: var(--muted); font-family: var(--font); }
.stack { font-family: var(--font); font-size: 12px; padding: 0 14px; display: grid; gap: 2px; overflow-wrap: anywhere; }

.err { color: var(--bad); font-size: 12px; }
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "top" "main" "rail"; }
  .rail { flex-direction: row; justify-content: space-around; border-right: 0; border-top: 1px solid var(--line); padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .rail button { flex: 1; }
  main { padding: 14px 16px 20px; }
  .brand, .crumb { display: none; }
  .target { flex: 1 1 auto; }
  .tl-row { grid-template-columns: 130px minmax(240px, 1fr) 56px; }
}
</style>

    <circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${color}"/></svg>`;
}

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// "Where to look": the bottlenecks found in the data already recorded, most severe first (core Findings is the Java port).
// A finding: { sev: bad | warn | info | ok, icon, line: [[kind, text]] (t text, m method or class, b bold, n bold number), small, link }
function ownCode(include) {
  const p = (include || "").split(",").map(x => x.trim()).filter(x => x).map(x => x.endsWith(".") || /[A-Z]/.test(x[x.lastIndexOf(".") + 1]) ? x : x + ".");
  return p.length ? n => p.some(x => n.startsWith(x)) : n => !/^(java|javax|jdk|sun|com\.sun)\./.test(n);
}
const RANK = ["bad", "warn", "info", "ok"];
const secText = s => Math.round(s * 10) / 10 + " s";
const spanText = s => s < 120 ? Math.round(s) + " s" : Math.round(s / 60) + " min";
const sizeText = mb => mb >= 1024 ? (mb / 1024).toFixed(1) + " GB" : mb.toFixed(0) + " MB";
const threadsText = n => n + (n === 1 ? " thread" : " threads");
const shortLock = l => { const at = l.indexOf("@"); return l.slice(l.lastIndexOf(".", at < 0 ? l.length : at) + 1); };
function findings() {
  const own = ownCode(snap.target.include), ga = gc ? analyzeGc(gc, state.elapsed) : null, out = [];
  // CPU: the process saturates the CPUs; the application method whose code (and the library code it calls) uses the most CPU time
  const last = recent("cpu").slice(-60), avg = last.reduce((a, b) => a + b, 0) / (last.length || 1);
  if (last.length >= 10 && avg >= 90)
    out.push({ sev: "warn", icon: "speed", line: [["t", "The process uses "], ["n", avg.toFixed(0) + " %"], ["t", " of all CPUs"]],
      small: "Work waits for a CPU: reduce the hot spots, or add CPUs", link: { label: "View hot spots", go: "cpu", cputab: "hot" } });
  if (root.total > 0) {
    const mine = new Map(), lib = new Map();
    const attribute = (n, owner) => {
      const o = own(n.name) ? n.name : owner, k = o ?? n.name;
      mine.set(k, (mine.get(k) || 0) + n.self);
      if (k !== n.name) { const l = lib.get(k) || new Map(); l.set(n.name, (l.get(n.name) || 0) + n.self); lib.set(k, l); }
      n.children.forEach(c => attribute(c, o));
    };
    root.children.forEach(c => attribute(c, null));
    let top = null;
    for (const [k, v] of mine) if (top === null || v > mine.get(top)) top = k;
    const libs = [...(lib.get(top) || new Map())].sort((a, b) => b[1] - a[1]);
    const small = libs.slice(0, 2).map(([n, ms]) => shortName(n) + " " + fmtMs(ms));
    small.push("self " + fmtMs(mine.get(top) - libs.reduce((a, l) => a + l[1], 0)));
    const h = hot.find(x => x.name === top);
    if (h && h.calls > 0) small.push("calls " + calls(h.calls));
    out.push({ sev: "info", icon: "local_fire_department", line: [["t", (mine.get(top) / root.total * 100).toFixed(0) + " % of CPU time is in "], ["m", top], ["t", libs.length ? " and the library code it calls" : ""]],
      small: small.join(" · "), link: { label: "View hot spots", go: "cpu", cputab: "hot", sel: top } });
  }
  // threads: the lock waited for longest, and the application method that waited longest for I/O
  const waits = snap.waits || [];
  const group = (match, key) => {
    const gs = new Map();
    for (const w of waits.filter(match)) {
      const g = gs.get(key(w)) || { sec: 0, first: null, owner: null, threads: new Set() };
      g.sec += w.sec;
      if (!g.first || w.sec > g.first.sec) g.first = w;
      g.owner ??= w.owner ?? null;
      w.threads.forEach(t => g.threads.add(t));
      gs.set(key(w), g);
    }
    let best = null;
    for (const g of gs.values()) if (g.sec > 0 && g.threads.size && (!best || g.sec > best.sec)) best = g;
    return best;
  };
  const lock = group(w => w.state === "block", w => w.lock ?? w.site), io = group(w => w.state === "io" && own(w.site), w => w.site);
  const nThreads = out.length;
  if (lock) {
    const w = lock.first;
    out.push({ sev: lock.sec >= 0.1 * Math.max(1, state.elapsed) ? "bad" : "warn", icon: "lock",
      line: [["t", "Threads waited "], ["n", secText(lock.sec)], ["t", w.lock ? " for " : " for a lock"], ["b", w.lock ? shortLock(w.lock) : ""], ["t", " in "], ["m", w.site]],
      small: (lock.owner ? `held by ${lock.owner} · ` : "") + threadsText(lock.threads.size) + " waiting", link: { label: "View threads", go: "threads", thread: [...lock.threads][0] } });
  } else if (!snap.waits) {
    // older snapshots: the thread blocked longest
    const b = threads.filter(t => secIn(t, "block") > 0).reduce((a, t) => (!a || secIn(t, "block") > secIn(a, "block") ? t : a), null);
    if (b) out.push({ sev: "warn", icon: "lock", line: [["b", b.name], ["t", ` was blocked for ${secIn(b, "block")} s in total`]],
      small: b.stack[0] ?? null, link: { label: "View threads", go: "threads", thread: b.name } });
  }
  if (io) out.push({ sev: "warn", icon: "timer", line: [["m", io.first.site], ["t", " waited "], ["n", secText(io.sec)], ["t", " for I/O"]],
    small: `in ${shortName(io.first.top)} · ${threadsText(io.threads.size)}`, link: { label: "View threads", go: "threads", thread: [...io.threads][0] } });
  if (out.length === nThreads)
    out.push({ sev: "ok", icon: "view_timeline", line: [["t", "No thread waited for a lock" + (snap.waits ? " or for I/O in the application's code" : "")]], small: null, link: { label: "View threads", go: "threads" } });
  // memory: the growth since Before, when it is set; else, when the heap after GC keeps growing, the class that grew with it.
  // Class histograms count unreachable objects too, so a class that grows while the heap after GC does not is no leak
  const memLink = { label: "View memory", go: "memory", memtab: "heap" };
  if (state.snapBefore) {
    const g = abRows().reduce((a, r) => (!a || r.diff > a.diff ? r : a), null);
    const span = state.snapAfter ? "from Before to After" : "since Before";
    out.push(g && g.diff > 0
      ? { sev: "warn", icon: "memory", line: [["m", g.c.name], ["t", " grew by "], ["n", "+" + fmtInt(g.diff)], ["t", " instances " + span]], small: "A possible leak if it does not shrink after GC", link: memLink }
      : { sev: "ok", icon: "memory", line: [["t", "No class grew " + span]], small: null, link: memLink });
  } else if (ga && ga.problems.some(p => p.title === "Heap after GC keeps growing")) {
    // the class whose instances grew most (by 10 % and 1 MB at least, falling in at most a tenth of the histograms: leaked objects stay reachable),
    // the application's own classes first (they say what leaks, byte[] only what it holds); without one, the GC finding says it
    const h = chist, n = h.length;
    let best = null, bestRatio = 0;
    if (n >= 3 && h[n - 1].t - h[0].t >= 60)
      for (const c of Object.keys(h[n - 1].count).sort()) {
        const first = h[0].count[c] || 0, lastC = h[n - 1].count[c];
        let down = 0;
        for (let k = 1; k < n; k++) if ((h[k].count[c] || 0) < (h[k - 1].count[c] || 0)) down++;
        const ratio = lastC / first, grew = (h[n - 1].bytes[c] || 0) - (h[0].bytes[c] || 0);
        const better = !best || own(c) && !own(best) || own(c) === own(best) && ratio > bestRatio;
        if (first > 0 && grew >= 1048576 && ratio >= 1.1 && down <= 0.1 * (n - 1) && better) { best = c; bestRatio = ratio; }
      }
    if (best) {
      const a = h[0], z = h[n - 1];
      out.push({ sev: "bad", icon: "memory", line: [["m", best], ["t", " grew by "], ["n", "+" + fmtInt(z.count[best] - a.count[best])], ["t", " instances in " + spanText(z.t - a.t)]],
        small: `+${fmtBytes((z.bytes[best] || 0) - (a.bytes[best] || 0))} across ${n} class histograms while the heap after GC grows. A possible leak`, link: memLink });
    }
  } else out.push({ sev: "ok", icon: "memory", line: [["t", "No sign of a memory leak"]],
    small: ga ? "The heap after GC does not keep growing" : "No GC yet: a leak shows as heap after GC that keeps growing", link: memLink });
  // threads that are started and never end
  if (tel.t.length >= 2 && tel.t.at(-1) - tel.t[0] >= 60) {
    const first = tel.threads[0], lastT = tel.threads.at(-1);
    if (lastT - first >= 20 && lastT >= 1.5 * first)
      out.push({ sev: "warn", icon: "view_timeline", line: [["t", "The thread count grew from "], ["n", fmtInt(first)], ["t", " to "], ["n", fmtInt(lastT)]],
        small: "Threads are started and do not end: check thread pools and executors", link: { label: "View threads", go: "threads" } });
  }
  // who allocates most, when a GC problem comes from allocation
  const allocs = snap.memory.allocations || [];
  if (ga && allocs.length && ga.problems.some(p => p.alloc)) {
    const bySite = new Map();
    for (const x of allocs) bySite.set(x.site, (bySite.get(x.site) || 0) + x.mb);
    let top = null;
    for (const [k, v] of bySite) if (top === null || v > bySite.get(top)) top = k;
    const total = allocs.reduce((a, x) => a + x.mb, 0), cls = allocs.filter(x => x.site === top).reduce((a, x) => (!a || x.mb > a.mb ? x : a), null);
    out.push({ sev: "warn", icon: "delete_sweep", line: [["m", top], ["t", " allocates "], ["n", (bySite.get(top) / total * 100).toFixed(0) + " %"], ["t", " of the memory"]],
      small: `mostly ${cls.cls} · ${sizeText(bySite.get(top))} in the recording. Fewer allocations mean fewer GCs`, link: { label: "View allocations", go: "memory", memtab: "gc" } });
  }
  if (ga) {
    const gp = ga.problems[0];
    out.push({ ...(gp ? { sev: gp.sev, icon: gp.icon, line: [["t", gp.title]], small: gp.detail + (ga.problems.length > 1 ? ` · ${ga.problems.length - 1} more` : "") }
      : { sev: "ok", icon: "check_circle", line: [["t", "GC looks healthy"]], small: `throughput ${ga.throughput.toFixed(1)} % · max pause ${fmtPause(ga.max)}` }),
      link: { label: "View GC analysis", go: "memory", memtab: "gc" } });
  }
  return out.sort((a, b) => RANK.indexOf(a.sev) - RANK.indexOf(b.sev));
}

function viewOverview() {
  const blocked = threads.map(t => ({ t, b: secIn(t, "block") }))
    .sort((a, b) => b.b - a.b)[0];
  const ga = gc ? analyzeGc(gc, state.elapsed) : null;
  // the sparklines show the one-second points (the last 10 minutes); before the first second there are none
  const some = tel.t.length > 0, heapNow = some ? tel.heap.at(-1) : heapAt(state.elapsed);
  const blockedNow = threads.filter(t => (t.segs.at(-1) || [])[2] === "block").length;
  return `
  <div class="view-head"><h1>Overview</h1></div>
  <div class="tiles">
    <button type="button" class="panel tile" data-go="cpu" data-cputab-go="hot" title="Open CPU hot spots"><div class="label"><svg class="ic" aria-hidden="true"><use href="#i-speed"/></svg>CPU (process)<svg class="ic go" aria-hidden="true"><use href="#i-arrow_forward"/></svg></div>
      <div class="value num">${some ? tel.cpu.at(-1).toFixed(0) + " %" : "—"}</div><div class="sub">last ${recent("cpu").length} s</div>${spark(recent("cpu"), css("--accent"), 100)}</button>
    <button type="button" class="panel tile" data-go="memory" data-memtab="heap" title="Open memory: heap & classes"><div class="label"><svg class="ic" aria-hidden="true"><use href="#i-memory"/></svg>Heap usage<svg class="ic go" aria-hidden="true"><use href="#i-arrow_forward"/></svg></div>
      <div class="value num">${heapNow != null ? heapNow.toFixed(0) + " MB" : "—"}</div><div class="sub">max ${fmtInt(snap.memory.heapMaxMB)} MB</div>${spark(recent("heap"), css("--run"), snap.memory.heapMaxMB)}</button>
    <button type="button" class="panel tile" data-go="memory" data-memtab="gc" title="Open memory: GC analysis"><div class="label"><svg class="ic" aria-hidden="true"><use href="#i-delete_sweep"/></svg>GC throughput<svg class="ic go" aria-hidden="true"><use href="#i-arrow_forward"/></svg></div>
      ${ga ? `<div class="value num" style="color:var(${ga.throughput < 95 ? "--bad" : "--fg"})">${ga.throughput.toFixed(1)} %</div>
      <div class="sub">${fmtInt(ga.n)} GCs · max pause ${fmtPause(ga.max)}</div>${spark(gc.events.slice(-120).map(e => e.pauseMs), css("--bad"), Math.max(50, ga.max), 48, false)}`
      : `<div class="value">—</div><div class="sub">No GC events</div>`}</button>
    <button type="button" class="panel tile" data-go="threads" data-thread="${blocked && blocked.b ? threads.indexOf(blocked.t) : state.thread}" title="Open threads (selects the longest-blocked thread)"><div class="label"><svg class="ic" aria-hidden="true"><use href="#i-view_timeline"/></svg>Threads<svg class="ic go" aria-hidden="true"><use href="#i-arrow_forward"/></svg></div>
      <div class="value num">${some ? tel.threads.at(-1) : threads.length}</div><div class="sub">${blockedNow} blocked</div>${spark(recent("threads"), css("--wait"), 40)}</button>
  </div>
  <section class="panel insights">
    <h2>Where to look</h2>
    ${findings().map(f => { const l = f.link, ti = l.thread != null ? threads.findIndex(t => t.name === l.thread) : -1;
      return `<div class="insight ${f.sev === "bad" || f.sev === "warn" ? "warn" : ""}"><svg class="ic" aria-hidden="true"><use href="#i-${f.icon}"/></svg>
      <p>${f.line.map(([k, t]) => k === "m" ? method(t) : k === "b" ? `<b>${esc(t)}</b>` : k === "n" ? `<b class="num">${esc(t)}</b>` : esc(t)).join("")}${f.small ? `<small>${esc(f.small)}</small>` : ""}</p>
      <button class="link" data-go="${l.go}"${l.memtab ? ` data-memtab="${l.memtab}"` : ""}${l.cputab ? ` data-cputab-go="${l.cputab}"` : ""}${l.sel ? ` data-sel="${esc(l.sel)}"` : ""}${ti >= 0 ? ` data-thread="${ti}"` : ""}>${esc(l.label)}</button></div>`; }).join("")}
  </section>`;
}

function viewCpu() {
  const tabs = `<div class="seg" role="group" aria-label="View">
    <button type="button" data-cputab="hot" aria-pressed="${state.cpuTab === "hot"}"><svg class="ic" aria-hidden="true"><use href="#i-local_fire_department"/></svg>Hot spots</button>
    <button type="button" data-cputab="tree" aria-pressed="${state.cpuTab === "tree"}"><svg class="ic" aria-hidden="true"><use href="#i-account_tree"/></svg>Call tree</button></div>`;
  const search = `<label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search methods" value="${esc(state.q)}" aria-label="Search methods"></label>`;
  const treeBtns = state.cpuTab === "tree" ? `
    <button type="button" class="btn" id="hotpath" title="Expand the most expensive path"><svg class="ic" aria-hidden="true"><use href="#i-route"/></svg>Expand hot path</button>
    <button type="button" class="btn icon" id="expandall" title="Expand all" aria-label="Expand all"><svg class="ic" aria-hidden="true"><use href="#i-unfold_more"/></svg></button>
    <button type="button" class="btn icon" id="collapseall" title="Collapse all" aria-label="Collapse all"><svg class="ic" aria-hidden="true"><use href="#i-unfold_less"/></svg></button>` : "";
  const body = state.cpuTab === "hot" ? hotTable() : `<div class="tree-tools">${treeBtns}</div>` + treeView();
  return `<div class="view-head"><h1>CPU</h1>${tabs}${search}</div>
    <div class="split"><section class="panel">${body}</section>${detail()}</div>`;
}
// sorting: strings lexicographically, numbers by value. dir is "asc" | "desc"
function sorter(val, dir) {
  const k = dir === "asc" ? 1 : -1;
  return (a, b) => { const x = val(a), y = val(b); return (typeof x === "string" ? x.localeCompare(y) : x - y) * k; };
}
// sortable column header (shared by table th and the call tree header)
function sortHead(tag, key, label, curKey, curDir, attr, left) {
  const on = curKey === key;
  const arrow = on ? '<svg class="ic sort-ic" aria-hidden="true"><use href="#i-expand_more"/></svg>' : "";
  const btn = `<button type="button" data-${attr}="${key}" class="${on && curDir === "asc" ? "asc" : ""}" aria-pressed="${on}" title="Sort by ${esc(label)}">${label}${arrow}</button>`;
  if (tag === "th") return `<th class="${left ? "" : "r"}" ${on ? `aria-sort="${curDir === "asc" ? "ascending" : "descending"}"` : ""}>${btn}</th>`;
  return `<span>${btn}</span>`;
}

function hotTable() {
  const q = state.q.toLowerCase();
  const val = { name: h => h.name, self: h => h.self, pct: h => h.self, calls: h => h.calls, avg: h => h.self / Math.max(1, h.calls) }[state.sortKey];
  const rows = hot.filter(h => !q || h.name.toLowerCase().includes(q)).sort(sorter(val, state.sortDir));
  const max = Math.max(...hot.map(h => h.self));
  const th = (k, l, left) => sortHead("th", k, l, state.sortKey, state.sortDir, "sort", left);
  if (!rows.length) return `<div class="empty">No methods match "${esc(state.q)}"</div>`;
  return `<div class="tbl-wrap scroll-y"><table class="fixed" data-rz-table="hot">${colgroup("hot")}<thead><tr>${th("name", "Method", true)}${th("self", "Self time")}${th("pct", "Share")}${th("calls", "Calls")}${th("avg", "Average")}</tr></thead><tbody>
    ${rows.map(h => `<tr class="row" tabindex="0" data-hot="${esc(h.name)}" aria-selected="${state.sel === h.name}">
      <td class="mcell">${method(h.name, state.q)}</td>
      <td class="r num"><span class="meter"><i style="width:${(h.self / max * 100).toFixed(1)}%"></i></span>${time(h.self)}</td>
      <td class="r num">${(h.self / root.total * 100).toFixed(1)} %</td>
      <td class="r num">${calls(h.calls)}</td><td class="r num">${perCall(h.self, h.calls)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function fmtAvg(ms) { return ms >= 1000 ? fmtSec(ms) : ms >= 1 ? ms.toFixed(1) + " ms" : (ms * 1000).toFixed(ms * 1000 >= 10 ? 0 : 1) + " µs"; }

function treeView() {
  const q = state.q.toLowerCase();
  let visible = null;
  if (q) { // show only matching nodes and their ancestors
    visible = new Set();
    walk(root, n => { if (n.name.toLowerCase().includes(q)) for (let p = n; p; p = p.parent) visible.add(p.id); });
  }
  const tval = { name: n => n.name, total: n => n.total, self: n => n.self, calls: n => n.calls }[state.tsortKey];
  const tsort = sorter(tval, state.tsortDir);
  const out = [];
  (function rec(n) {
    if (visible && !visible.has(n.id)) return;
    out.push(n);
    if (n.children.length && (state.expanded.has(n.id) || visible)) [...n.children].sort(tsort).forEach(rec);
  })(root);
  if (visible && visible.size === 0) return `<div class="empty">No methods match "${esc(state.q)}"</div>`;
  const vars = colw.tree.slice(1).map((w, i) => `--c${i + 1}:${w}px`).join(";");
  return `<div class="tree-wrap" data-rz-table="tree" style="${vars}"><div class="thead">${[["name", "Method"], ["total", "Total"], ["self", "Self"], ["calls", "Calls"]].map(([k, l], i) => sortHead("span", k, l, state.tsortKey, state.tsortDir, "tsort")).join("")}</div><div class="tree scroll-y" role="tree">
    ${out.map(n => {
      const pct = n.total / root.total * 100, spct = n.self / root.total * 100;
      const open = state.expanded.has(n.id) || !!visible;
      return `<div class="trow" role="treeitem" tabindex="0" data-node="${n.id}" aria-selected="${state.sel === n.name}" ${n.children.length ? `aria-expanded="${open}"` : ""}>
        <div class="name" style="padding-left:${n.depth * 18 + 6}px">
          <button type="button" class="tog ${n.children.length ? "" : "leaf"}" data-tog="${n.id}" aria-expanded="${open}" aria-label="Toggle"><svg class="ic" aria-hidden="true"><use href="#i-expand_more"/></svg></button>
          <span class="meter" title="${pct.toFixed(1)} %"><i style="width:${pct.toFixed(1)}%"></i><i style="width:${spct.toFixed(1)}%"></i></span>
          <span class="num" style="width:52px;color:var(--muted);font-size:12px">${pct.toFixed(1)}%</span>
          ${n.parent ? method(n.name, state.q) : `<b>${esc(n.name)}</b>`}</div>
        <span class="c num">${time(n.total)}</span><span class="c num">${n.parent ? time(n.self) : ""}</span><span class="c num">${n.parent ? calls(n.calls) : ""}</span></div>`;
    }).join("")}</div></div>`;
}
// aggregate the selected method over the whole call tree (also works for self-0 methods missing from hot spots)
function methodInfo(name) {
  const nodes = [];
  walk(root, n => { if (n.parent && n.name === name) nodes.push(n); });
  if (!nodes.length) return null;
  const inSame = n => { for (let p = n.parent; p; p = p.parent) if (p.name === name) return true; return false; };
  let self = 0, total = 0, calls = 0;
  const callers = new Map(), callees = new Map();
  for (const n of nodes) {
    self += n.self; calls += n.calls;
    if (inSame(n)) continue;   // do not double-count recursion in total
    total += n.total;
    const c = n.parent.parent ? n.parent.name : "(thread root)";
    callers.set(c, (callers.get(c) || 0) + n.total);
  }
  for (const n of nodes) for (const ch of n.children) if (ch.name !== name) callees.set(ch.name, (callees.get(ch.name) || 0) + ch.total);
  const sortMap = m => [...m.entries()].map(([k, v]) => ({ name: k, ms: v })).sort((a, b) => b.ms - a.ms);
  const exact = exactCalls();
  return { name, self, total, calls: exact ? exact.get(name) || 0 : calls, callers: sortMap(callers), callees: sortMap(callees) };
}
function shortName(name) { return name.split(".").slice(-2).join("."); }

function detail() {
  const m = state.sel && methodInfo(state.sel);
  if (!m) return `<aside class="panel side"><div class="empty"><b>Select a method</b><br>to see where its time goes and where it is called from.</div></aside>`;
  const i = m.name.lastIndexOf(".", m.name.lastIndexOf(".") - 1);
  const pkg = i > 0 ? m.name.slice(0, i) : "";
  // time breakdown: Self + top 3 callees + others
  const parts = [{ label: "Self", ms: m.self, self: true }, ...m.callees.slice(0, 3).map(c => ({ label: shortName(c.name), name: c.name, ms: c.ms }))];
  const rest = m.total - parts.reduce((a, p) => a + p.ms, 0);
  if (rest > m.total * 0.005) parts.push({ label: `${m.callees.length - 3} others`, ms: rest });
  const COLORS = ["var(--bar-self)", "var(--accent)", "var(--io)", "var(--wait)", "var(--muted)"];
  const bar = parts.map((p, k) => `<i style="width:${(p.ms / m.total * 100).toFixed(2)}%;background:${COLORS[k]}" title="${esc(p.label)}"></i>`).join("");
  const row = (dot, label, ms, base, link) => `<li${link ? ` class="pick" data-hot="${esc(link)}" tabindex="0" title="${esc(link)}"` : ""}>
      <span class="dot" style="background:${dot}"></span><span class="lbl">${esc(label)}</span>
      <span class="num">${time(ms)}</span><span class="num share">${(ms / base * 100).toFixed(0)} %</span></li>`;
  const maxCaller = Math.max(...m.callers.map(c => c.ms), 1);
  return `<aside class="panel side detail">
    <div class="d-head"><h2 class="d-name">${esc(shortName(m.name))}</h2><div class="d-pkg">${esc(pkg.split(".").slice(0, -1).join("."))}</div></div>
    <div class="d-stats">
      <div><span>Self</span><b class="num">${time(m.self)}</b></div>
      <div><span>Total</span><b class="num">${time(m.total)}</b></div>
      <div><span>Calls</span><b class="num">${calls(m.calls)}</b></div>
      <div title="Total ÷ calls"><span>Per call</span><b class="num">${perCall(m.total, m.calls)}</b></div>
    </div>
    <h3>Time breakdown</h3>
    ${m.total > 0 ? `<div class="d-bar">${bar}</div>
    <ul class="d-list">${parts.map((p, k) => row(COLORS[k], p.label, p.ms, m.total, p.name)).join("")}</ul>` : `<p class="empty" style="padding:0 14px">No samples</p>`}
    <h3>Callers</h3>
    <ul class="d-list callers">${m.callers.slice(0, 5).map(c => `<li${c.name.startsWith("(") ? "" : ` class="pick" data-hot="${esc(c.name)}" tabindex="0" title="${esc(c.name)}"`}>
      <span class="lbl">${esc(c.name.startsWith("(") ? c.name : shortName(c.name))}</span><span class="num">${time(c.ms)}</span><span class="num share">${(c.ms / m.total * 100).toFixed(0)} %</span>
      <span class="minibar"><i style="width:${(c.ms / maxCaller * 100).toFixed(1)}%"></i></span></li>`).join("")}
      ${m.callers.length > 5 ? `<li class="more">${m.callers.length - 5} more</li>` : ""}</ul>
    <div class="d-actions"><button type="button" class="btn" id="showintree"><svg class="ic" aria-hidden="true"><use href="#i-account_tree"/></svg>Show in call tree</button></div>
  </aside>`;
}

// chart with axes. The SVG is stretched horizontally, so tick labels are HTML outside it.
// x0..x1 are seconds since start. inner(X, Y) draws the content. marks is [{t, label}]
// heap limit (-Xmx) and initial size (-Xms), drawn as horizontal lines when the snapshot has them
function heapLimits() {
  const xmx = snap.memory.heapMaxMB, xms = snap.memory.xmsMB;
  return [xmx && { v: xmx, label: `-Xmx ${fmtInt(xmx)} MB` }, xms && xms < xmx && { v: xms, label: `-Xms ${fmtInt(xms)} MB` }].filter(Boolean);
}
// Full GC icons (position 0..100 %); hover for details
const gcMarks = (fulls, pos) => fulls.map(e => `<span class="gc-mark" style="left:${pos(e.t).toFixed(2)}%" title="Full GC ${fmtTod(e.t)} · ${esc(e.manual ? "System.gc() (Run GC)" : e.cause)} · ${e.beforeMB} → ${e.afterMB} MB · pause ${fmtPause(e.pauseMs)}"><svg class="ic" aria-hidden="true"><use href="#i-delete"/></svg></span>`).join("");
const gcLineSvg = (fulls, X, H) => fulls.map(e => `<line x1="${X(e.t)}" x2="${X(e.t)}" y1="0" y2="${H}" stroke="${css("--event")}" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`).join("");
const hlineSvg = (lims, Y, W) => lims.map(l => `<line x1="0" x2="${W}" y1="${Y(l.v)}" y2="${Y(l.v)}" stroke="${css("--limit")}" stroke-width="0.75" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`).join("");
const hlineLabels = (lims, ymax) => lims.map(l => { const top = 100 - l.v / ymax * 100; return `<span class="hlim" style="top:${top.toFixed(2)}%">${esc(l.label)}</span>`; }).join("");

function axisChart({ W = 600, H = 152, ymax, unit = "MB", x0, x1, inner, marks = [], label = "", pick = null, hlines = [], gcFulls = [] }) {
  const dur = Math.max(1, x1 - x0);
  const X = t => ((t - x0) / dur * W).toFixed(1), Y = v => (H - v / ymax * H).toFixed(1);
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(ymax * f));
  const step = [5, 10, 15, 20, 30, 60, 120, 300, 600, 1200, 1800, 3600, 7200, 10800, 21600, 43200].find(s => dur / s <= 6) || 43200;
  const xTicks = todTicks(x0, x1, step);
  const pos = t => (t - x0) / dur * 100;
  const xLabel = t => { const p = pos(t); const tr = p < 3 ? "none" : p > 97 ? "translateX(-100%)" : "translateX(-50%)"; return `<span style="left:${p.toFixed(2)}%;transform:${tr}">${fmtTod(t)}</span>`; };
  const inRange = marks.filter(m => m.t >= x0 && m.t <= x1);
  return `<div class="chart axis-chart${gcFulls.length ? " gc-below" : ""}">
    <div class="y-title">${unit}</div>
    <div class="y-axis">${yTicks.map(v => `<span style="top:${(100 - v / ymax * 100).toFixed(2)}%">${fmtInt(v)}</span>`).join("")}</div>
    <div class="plot${pick ? " pickable" : ""}" ${pick ? `data-x0="${x0}" data-x1="${x1}" data-min="${pick.min ?? ""}" data-label="${esc(pick.label)}"` : ""}><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${esc(label)}">
      ${yTicks.slice(1, -1).map(v => `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css("--line")}" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("")}
      ${xTicks.map(t => `<line x1="${X(t)}" x2="${X(t)}" y1="0" y2="${H}" stroke="${css("--line")}" stroke-width="1" stroke-opacity=".6" vector-effect="non-scaling-stroke"/>`).join("")}
      ${inner(X, Y, H, W)}
      ${gcLineSvg(gcFulls.filter(e => e.t >= x0 && e.t <= x1), X, H)}
      ${hlineSvg(hlines, Y, W)}
      ${inRange.map(m => `<line x1="${X(m.t)}" x2="${X(m.t)}" y1="0" y2="${H}" stroke="${css("--bad")}" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join("")}
    </svg>${hlineLabels(hlines, ymax)}${inRange.map(m => `<span class="mark-label" style="left:${pos(m.t).toFixed(2)}%">${esc(m.label)}</span>`).join("")}
    ${pick ? `${pick.min != null && pick.min >= x0 ? `<div class="pick-block" style="width:${Math.min(100, pos(pick.min)).toFixed(2)}%"></div>` : ""}
      <div class="pick-line" ${state.hoverT == null ? "hidden" : ""} style="left:${state.hoverT == null ? 0 : pos(state.hoverT).toFixed(2)}%"><span>${esc(pick.label)} ${state.hoverT == null ? "" : fmtTod(state.hoverT)}</span></div>` : ""}</div>
    <div class="x-axis">${gcMarks(gcFulls.filter(e => e.t >= x0 && e.t <= x1), pos)}${xTicks.map(xLabel).join("")}</div>
    <div class="x-title">Time</div>
  </div>`;
}

// reference points Before / After: copy per-class counts and sizes at that time. Without After, compare with now
function takeSnap() { return { t: state.elapsed, count: Object.fromEntries(classes.map(c => [c.name, c.count])), bytes: Object.fromEntries(classes.map(c => [c.name, c.bytes])) }; }
// heap usage is derived from GC events (drops right after a GC and grows with allocation until the next one).
// so every drop in the chart is a GC
function heapAt(t) {
  const ev = gc && gc.events;
  if (!ev || !ev.length) return null;
  if (t <= ev[0].t) {                      // before the first GC: extrapolate back at the next interval's rate
    const r1 = ev[1] ? (ev[1].beforeMB - ev[0].afterMB) / Math.max(1e-3, ev[1].t - ev[0].t) : 0;
    return Math.max(ev[0].afterMB, ev[0].beforeMB - r1 * (ev[0].t - t));
  }
  let lo = 0, hi = ev.length - 1;          // last GC at or before t
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ev[mid].t <= t) lo = mid; else hi = mid - 1; }
  const e = ev[lo], nx = ev[lo + 1];
  if (nx) return e.afterMB + (nx.beforeMB - e.afterMB) * (t - e.t) / Math.max(1e-6, nx.t - e.t);
  const prev = ev[lo - 1];                  // after the last GC: extend at the latest allocation rate
  const rate = prev ? Math.max(0, (e.beforeMB - prev.afterMB) / Math.max(1e-3, e.t - prev.t)) : 0;
  return Math.min(gc.heapMaxMB, e.afterMB + rate * (t - e.t));
}
// align the per-second values (overview tiles, current value) with the GC events
function syncHeapTelemetry(lastOnly) {
  if (!gc || !gc.events.length || !tel.t.length) return;
  const n = tel.heap.length;
  for (let i = lastOnly ? n - 1 : 0; i < n; i++) tel.heap[i] = heapAt(tel.t[i]);
}

// growth per second (for the sample; same as while recording)
function classRate(c) { return c.leak ? 420 : c.name === "byte[]" ? 900 : c.name === "java.lang.String" ? 700 : 40; }
function pushHist() { chist.push(takeSnap()); chist = compactHist(chist, state.elapsed); }
// state at time t (closest entry in the history)
function snapAt(t) {
  if (!chist.length) return takeSnap();
  let best = chist[0];
  for (const h of chist) if (Math.abs(h.t - t) < Math.abs(best.t - t)) best = h;
  return { t: best.t, count: { ...best.count }, bytes: { ...best.bytes } };
}
function abRows() {
  const A = state.snapBefore, B = state.snapAfter;   // A = Before, B = After
  return classes.map(c => {
    const b = B ? (B.count[c.name] ?? 0) : c.count, bb = B ? (B.bytes[c.name] ?? 0) : c.bytes;
    return { c, a: A.count[c.name] ?? 0, b, diff: b - (A.count[c.name] ?? 0), dbytes: bb - (A.bytes[c.name] ?? 0) };
  });
}
const signed = (v, f = fmtInt) => (v > 0 ? "+" : v < 0 ? "−" : "") + f(Math.abs(v));

function memHead() {
  return `<div class="view-head"><h1>Memory</h1>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-memtab="gc" aria-pressed="${state.memTab === "gc"}"><svg class="ic" aria-hidden="true"><use href="#i-delete_sweep"/></svg>GC analysis</button>
      <button type="button" data-memtab="heap" aria-pressed="${state.memTab === "heap"}"><svg class="ic" aria-hidden="true"><use href="#i-memory"/></svg>Heap & classes</button></div>
    <button type="button" class="btn" id="gc"><svg class="ic" aria-hidden="true"><use href="#i-delete_sweep"/></svg>Run GC</button></div>`;
}
// Before / After: in the Classes panel, whose table they compare
function markBtns() {
  return `<span class="h2-tools"><button type="button" class="btn" id="snapBefore" title="Record the current per-class counts and sizes as Before"><svg class="ic" aria-hidden="true"><use href="#i-bookmark_add"/></svg>${state.snapBefore ? "Re-mark Before" : "Mark Before"}</button>
      <button type="button" class="btn" id="snapAfter" ${state.snapBefore ? "" : "disabled"} title="${state.snapBefore ? "Record the current state as After (shows the change from Before to After)" : "Mark Before first"}"><svg class="ic" aria-hidden="true"><use href="#i-bookmark_add"/></svg>${state.snapAfter ? "Re-mark After" : "Mark After"}</button></span>`;
}

function viewMemory() {
  if (state.memTab === "gc") return memHead() + viewGc();
  const used = tel.t.length ? tel.heap.at(-1) : heapAt(state.elapsed), max = snap.memory.heapMaxMB;
  // the whole recording, as on the GC analysis chart (older telemetry points cover more seconds)
  const x1 = state.elapsed, x0 = 0;
  const fulls = gc ? gc.events.filter(e => e.name === "Full" && e.t >= x0 && e.t <= x1) : [];
  const marks = [state.snapBefore && { t: state.snapBefore.t, label: "Before" }, state.snapAfter && { t: state.snapAfter.t, label: "After" }].filter(Boolean);
  const pk = state.picking === "before" ? { label: "Before" } : state.picking === "after" ? { label: "After", min: state.snapBefore.t } : null;
  const chart = axisChart({ ymax: max, x0, x1, marks, pick: pk, hlines: heapLimits(), gcFulls: fulls, label: "Heap usage over time", inner: (X, Y, H, W) => {
    // with GC events, draw before→after directly (each drop = GC); otherwise the per-second values
    const evs = gc && gc.events.length ? gc.events.filter(e => e.t > x0 && e.t < x1) : null;
    const pts = evs
      ? [`${X(x0)},${Y(heapAt(x0))}`, ...evs.map(e => `${X(e.t)},${Y(e.beforeMB)} ${X(e.t)},${Y(e.afterMB)}`), `${X(x1)},${Y(heapAt(x1))}`].join(" ")
      : tel.t.length ? [`${X(x0)},${Y(tel.heap[0])}`, ...tel.heap.map((v, i) => `${X(tel.t[i])},${Y(v)}`)].join(" ") : "";
    return `
      <polygon points="0,${H} ${pts} ${W},${H}" fill="${css("--run")}" fill-opacity=".16"/>
      <polyline points="${pts}" fill="none" stroke="${css("--run")}" stroke-width="${evs ? 1.2 : 1.8}" vector-effect="non-scaling-stroke"/>`;
  } });
  const A = state.snapBefore, B = state.snapAfter;
  const th = (k, l, left) => sortHead("th", k, l, state.memSort, state.memSort === "name" ? "asc" : "desc", "msort", left);
  let table;
  if (!A) {
    const sorted = [...classes].sort(sorter({ name: c => c.name, count: c => c.count, bytes: c => c.bytes }[state.memSort] || (c => c.bytes), state.memSort === "name" ? "asc" : "desc"));
    const maxB = Math.max(...classes.map(c => c.bytes));
    table = `<table class="fixed" data-rz-table="mem"><colgroup>${colw.mem.slice(0, 3).map(w => `<col${w ? ` style="width:${w}px"` : ""}>`).join("")}</colgroup>
      <thead><tr>${th("name", "Class", true)}${th("count", "Instances")}${th("bytes", "Size")}</tr></thead><tbody>
      ${sorted.map(c => `<tr><td class="mcell">${method(c.name)}</td><td class="r num">${fmtInt(c.count)}</td>
        <td class="r num"><span class="meter"><i style="width:${(c.bytes / maxB * 100).toFixed(1)}%"></i></span>${fmtBytes(c.bytes)}</td></tr>`).join("")}</tbody></table>`;
  } else {
    const rows = abRows().sort(sorter({ name: r => r.c.name, a: r => r.a, b: r => r.b, diff: r => r.diff, dbytes: r => r.dbytes }[state.memSort] || (r => r.diff), state.memSort === "name" ? "asc" : "desc"));
    const cls = v => v > 0 ? "plus" : v < 0 ? "minus" : "";
    table = `<table class="fixed" data-rz-table="mem"><colgroup>${colw.mem.map(w => `<col${w ? ` style="width:${w}px"` : ""}>`).join("")}</colgroup>
      <thead><tr>${th("name", "Class", true)}${th("a", "Before")}${th("b", B ? "After" : "Now")}${th("diff", "Δ instances")}${th("dbytes", "Δ size")}</tr></thead><tbody>
      ${rows.map(r => `<tr><td class="mcell">${method(r.c.name)}</td><td class="r num">${fmtInt(r.a)}</td><td class="r num">${fmtInt(r.b)}</td>
        <td class="r num ${cls(r.diff)}">${signed(r.diff)}</td><td class="r num ${cls(r.dbytes)}">${signed(r.dbytes, fmtBytes)}</td></tr>`).join("")}</tbody></table>`;
  }
  const ab = A ? `<div class="ab-bar"><span class="ab-chip"><b>Before</b>${fmtTod(A.t)}</span><span>→</span>
      <span class="ab-chip">${B ? `<b>After</b>${fmtTod(B.t)}` : "Now " + fmtTod(state.elapsed)}</span>
      <span>(change over ${(B ? B.t : state.elapsed) - A.t} s)</span>
      <button type="button" class="link" id="snapClear"><svg class="ic" aria-hidden="true" style="font-size:16px"><use href="#i-close"/></svg>Clear</button></div>`
    : `<div class="ab-bar">Mark Before to see changes from that point. Mark After to compare Before with After.</div>`;
  return `${memHead()}
  <section class="panel${pk ? " pick-target" : ""}" style="margin-bottom:14px">
    <h2>Heap usage ${pk
      ? `<span class="note pick-hint">Click the chart to pick the <b>${pk.label}</b> time${pk.min != null ? " (after Before)" : ""}</span>`
      : `<span class="note num" style="font-weight:400">${used != null ? `now ${used.toFixed(0)} MB · ` : ""}${snap.memory.xmsMB ? `-Xms${snap.memory.xmsMB}m ` : ""}-Xmx${max}m</span>`}</h2>
    ${pk ? `<button type="button" class="btn pick-cancel" id="pickCancel"><svg class="ic" aria-hidden="true" style="font-size:16px"><use href="#i-close"/></svg>Cancel (Esc)</button>` : ""}
    ${chart}
    <div class="gc-legend"><span><i style="background:var(--run)"></i>Heap usage (drops = GC)</span><span><svg class="ic gc-txt" aria-hidden="true"><use href="#i-delete"/></svg>Full GC</span>${marks.length ? `<span><i style="background:var(--bad)"></i>Before / After</span>` : ""}</div>
  </section>
  ${pk ? `<div class="pick-overlay" data-pick-cancel title="Click to cancel"></div>` : ""}
  <section class="panel">
    <h2>Classes${markBtns()}</h2>${ab}
    <div class="tbl-wrap">${table}</div>
  </section>`;
}

function viewGc() {
  if (!gc) return `<section class="panel"><div class="empty">This snapshot has no GC data. Once the agent writes JFR jdk.GarbageCollection and related events (gc.events), a GCeasy-style analysis appears here.</div></section>`;
  const a = analyzeGc(gc, state.elapsed);
  if (!a) return `<section class="panel"><div class="empty">No GC has happened yet.</div></section>`;
  const kpi = (cls, icon, label, value, sub) => `<section class="panel kpi ${cls}"><div class="label">${label}${icon ? `<svg class="ic fill" aria-hidden="true"><use href="#i-${icon}-fill"/></svg>` : ""}</div><div class="value num">${value}</div><div class="sub">${sub}</div></section>`;
  const tpOk = a.throughput >= 95;
  const longP = a.max >= 200 || a.p95 >= 100;
  // the summary line, with Copy GC log: the log of exactly these GCs
  const head = `<div class="gc-sum"><p class="note">${esc(gc.collector)} · max heap ${fmtInt(gc.heapMaxMB)} MB · ${fmtClock(Math.round(a.dur))} recorded · ${fmtInt(a.n)} GCs (Young ${fmtInt(a.kinds.Young)} / Mixed ${a.kinds.Mixed} / Full ${a.kinds.Full})</p>
    <button type="button" class="link" id="copylog" title="Unified logging format (-Xlog:gc), ready to paste into GCeasy / GCViewer"><svg class="ic" aria-hidden="true" style="font-size:16px"><use href="#i-content_copy"/></svg>${state.copied === "ok" ? "Copied" : "Copy GC log"}</button></div>
  ${state.copied === "fail" ? `<p class="note">Could not write to the clipboard. Select the text below and copy it.</p><textarea class="copy-fallback" id="logtext" readonly>${esc(gcLog(gc))}</textarea>` : ""}`;
  const kpis = `<div class="kpis">
    ${kpi(tpOk ? "good" : "bad", tpOk ? "check_circle" : "error", "Throughput", a.throughput.toFixed(1) + " %", "target ≥ 95 %")}
    ${kpi("", "", "Avg pause", fmtPause(a.avg), "p95 " + fmtPause(a.p95))}
    ${kpi(longP ? "warn" : "", longP ? "warning" : "", "Max pause", fmtPause(a.max), esc(a.maxEv.manual ? "System.gc() (Run GC)" : a.maxEv.cause))}
    ${kpi("", "", "Allocation rate", fmtInt(Math.round(a.allocRate)) + " MB/s", "total " + (a.allocTotal / 1024).toFixed(1) + " GB")}
    ${kpi("", "", "Promotion rate", a.promoRate.toFixed(1) + " MB/s", "Young → Old")}
  </div>`;
  const probs = `<aside class="panel side"><h2>Detected problems <span class="note" style="font-weight:400">rule-based · ${a.problems.length}</span></h2><div class="problems">

      : `<div class="problem ok"><svg class="ic fill" aria-hidden="true"><use href="#i-check_circle-fill"/></svg><b>No problems found</b><p>Throughput, pauses and the heap trend are all within limits</p><span></span></div>`}
  </div></aside>`;
  // heap before / after GC
  const W = 600, H = 200, maxMB = gc.heapMaxMB, dur = a.dur;
  const X = t => (t / dur * W).toFixed(1), Y = v => (H - v / maxMB * H).toFixed(1);
  // ticks: y = max heap in quarters, x = round seconds, at most 6

  const xTicks = todTicks(0, dur, step);
  // from the start to the end of the recording, like the heap chart: heapAt() extends the line before the first and after the last GC
  const saw = [`${X(0)},${Y(heapAt(0))}`, ...gc.events.map(e => `${X(e.t)},${Y(e.beforeMB)} ${X(e.t)},${Y(e.afterMB)}`), `${X(dur)},${Y(heapAt(dur))}`].join(" ");
  const dots = gc.events.filter((e, i) => gc.events.length < 400 || i % Math.ceil(gc.events.length / 400) === 0)
    .map(e => `<circle cx="${X(e.t)}" cy="${Y(e.afterMB)}" r="1.8" fill="${css("--accent")}"/>`).join("");
  const regUp = a.reg.slopePerMin > 0;
  const chart = `<section class="panel"><h2>Heap (before / after GC) <span class="note" style="font-weight:400">after-GC points trending up suggest a leak</span></h2>

      <div class="y-title">MB</div>
      <div class="y-axis">${yTicks.map(v => `<span style="top:${(100 - v / maxMB * 100).toFixed(2)}%">${fmtInt(v)}</span>`).join("")}</div>
      <div class="plot"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Heap usage before and after GC">
      ${yTicks.slice(1, -1).map(v => `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css("--line")}" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("")}
      ${xTicks.slice(1).map(t => `<line x1="${X(t)}" x2="${X(t)}" y1="0" y2="${H}" stroke="${css("--line")}" stroke-width="1" stroke-opacity=".6" vector-effect="non-scaling-stroke"/>`).join("")}
      <polygon points="0,${H} ${saw} ${W},${H}" fill="${css("--run")}" fill-opacity=".16"/>
      <polyline points="${saw}" fill="none" stroke="${css("--run")}" stroke-opacity=".7" stroke-width="1" vector-effect="non-scaling-stroke"/>
      ${dots}
      <line x1="0" x2="${W}" y1="${Y(a.reg.at(0))}" y2="${Y(a.reg.at(dur))}" stroke="${css(regUp ? "--bad" : "--good")}" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>
      ${gcLineSvg(a.fulls, X, H)}

      <div class="x-axis">${gcMarks(a.fulls, t => t / dur * 100)}${xTicks.map(t => { const p = t / dur * 100, tr = p < 3 ? "none" : p > 97 ? "translateX(-100%)" : "translateX(-50%)"; return `<span style="left:${p.toFixed(2)}%;transform:${tr}">${fmtTod(t)}</span>`; }).join("")}</div>
      <div class="x-title">Time</div>
    </div>
    <div class="gc-legend"><span><i style="background:var(--run)"></i>before → after GC</span><span><i style="background:var(--accent);height:6px;width:6px;border-radius:50%"></i>after GC</span>
      <span><i style="background:var(${regUp ? "--bad" : "--good"})"></i>after-GC trend <b class="num" style="color:var(${regUp ? "--bad" : "--good"})">${a.reg.slopePerMin >= 0 ? "+" : ""}${a.reg.slopePerMin.toFixed(1)} MB/min</b></span>
      <span><svg class="ic gc-txt" aria-hidden="true"><use href="#i-delete"/></svg>Full GC</span></div></section>`;
  // pause distribution

  const bw = 100 / a.hist.length;
  const hist = `<section class="panel"><h2>Pause distribution <span class="note" style="font-weight:400">ms · ${fmtInt(a.n)} GCs</span></h2><div class="hist">
    <svg viewBox="0 0 300 170" aria-label="Pause distribution">
      ${a.hist.map((b, i) => { const h = b.count ? Math.max(2, b.count / hmax * 120) : 0, x = i * 50 + 7, col = b.lo >= 200 ? "--bad" : b.lo >= 50 ? "--wait" : "--accent";
        return `<rect x="${x}" y="${136 - h}" width="36" height="${h}" rx="2" fill="${css(col)}"/>

    <tr><td><b>Total</b></td><td class="r num"><b>${fmtInt(a.n)}</b></td><td class="r num"><b>${fmtPause(a.totalPause)}</b></td><td class="r num"><b>${fmtPause(a.avg)}</b></td><td class="r num"><b>${fmtPause(a.max)}</b></td></tr>

  // generation sizes

  const gensHtml = `<section class="panel"><h2>Generation sizes <span class="note" style="font-weight:400">peak / committed</span></h2><div class="gens">

      <div class="gen-bar"><i class="${pc >= 80 ? "hi" : ""}" style="width:${pc.toFixed(1)}%"></i></div></div>`; }).join("") : `<div class="empty" style="padding:0">No gc.generations</div>`}
  </div></section>`;
  // who allocates: allocation samples by place (the application method nearest to the allocation) and class, the 20 largest
  const allocs = [...(snap.memory.allocations || [])].sort((x, y) => y.mb - x.mb), atotal = allocs.reduce((t, x) => t + x.mb, 0), amax = allocs.length ? allocs[0].mb : 1;
